name: Magellanic stellar analysis
on:
  push:
    paths: ['.github/MAGELLANIC_STELLAR_ANALYSIS_REQUEST']
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Restore stellar characterization
        run: |
          mkdir -p results/magellanic_blind800_stellar
          gh run download 35592537265 -n magellanic-blind800-stellar-characterization -D results/magellanic_blind800_stellar
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: python scripts/magellanic_stellar_analysis.py
      - uses: actions/upload-artifact@v4
        with: {name: magellanic-blind800-stellar-analysis, path: results/magellanic_blind800_stellar_analysis, retention-days: 90}
