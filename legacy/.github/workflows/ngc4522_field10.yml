name: NGC4522 field census and classification
on:
  push:
    paths: ['.github/NGC4522_FIELD_REQUEST']
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Run field classification with checkpoint budget
        run: |
          set +e
          timeout --signal=TERM 95m python scripts/ngc4522_field10.py
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then echo "Time budget reached; checkpoint preserved."; exit 2; fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ngc4522-field10-final, path: results/ngc4522_field10, retention-days: 90, if-no-files-found: warn}
