name: Method 2 finish 300
on:
  push:
    paths: ['.github/METHOD2_FINISH_REQUEST']
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -e .
      - name: Restore spectra
        run: |
          mkdir -p data/method2spec
          gh run download 35419639090 -n method2-300-spectra -D data/method2spec
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: python scripts/method2_measure_lines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: method2-300-line-measurements, path: 'results/method2_300_lines/*', retention-days: 90}
