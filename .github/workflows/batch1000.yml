name: 1000-object data retrieval
on:
  push:
    paths:
      - '.github/BATCH_1000_REQUEST'
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Retrieve 1000-object sample
        run: python scripts/batch_retrieve.py --count 1000 --seed 2609 --checkpoint results/batch1000/checkpoint.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-1000-retrieval
          path: results/batch1000/*
          retention-days: 7
