name: NGC4522 calibrated final classification
on:
  push:
    paths: ['.github/NGC4522_FINAL_REQUEST']
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ngc4522-field10-final
          path: results/ngc4522_field10
          run-id: 35664933689
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ngc4522-multiwavelength
          path: results/ngc4522_multiwavelength
          run-id: 35673099444
          github-token: ${{ github.token }}
      - run: python scripts/ngc4522_finalize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngc4522-final-v3
          path: results/ngc4522_final
          retention-days: 90
