name: Build desktop app

# PyInstaller one-folder builds of the Finding Objects app for Windows, macOS
# and Linux, each smoke-tested offline (frozen pipeline == source pipeline on
# the committed NGC 4522 raw catalogues) and uploaded as an artifact.
# A pushed tag "v<VERSION>" (e.g. v2.20.0), or a manual run with
# release=true, also publishes the three builds as zip files on a GitHub
# Release named v<VERSION> (the manual run creates that tag on the built
# commit), so a version stays downloadable after the 30-day artifact
# retention.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release v<v2/VERSION> from this commit"
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: [main, claude/code-review-7ox8zn]
    paths:
      - 'v2/app/**'
      - 'v2/VERSION'
      - '.github/workflows/build-app.yml'

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r v2/app/requirements.txt -r v2/app/packaging/requirements-build.txt
      - name: Build
        run: pyinstaller v2/app/packaging/finding_objects.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test (offline)
        shell: bash
        run: |
          exe=dist/FindingObjects/FindingObjects
          [ -f "$exe.exe" ] && exe="$exe.exe"
          python v2/app/packaging/smoke_test.py "$exe"
      # Zipped here, before upload: upload-artifact does not keep file modes,
      # so the Linux / macOS executable and its libraries came back without
      # the executable bit (2.23.0).  zip -y keeps symlinks (macOS frameworks).
      - name: Zip build (keeps permissions)
        shell: bash
        run: |
          name="FindingObjects-${{ runner.os }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -tzip -bd "../$name.zip" FindingObjects >/dev/null)
          else
            (cd dist && zip -qry "../$name.zip" FindingObjects)
          fi
          ls -l "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FindingObjects-${{ runner.os }}
          path: FindingObjects-${{ runner.os }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release tag from v2/VERSION
        run: |
          v="$(tr -d '[:space:]' < v2/VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Name each build's zip by the release tag
        run: |
          for d in builds/FindingObjects-*; do mv "$d/$(basename "$d").zip" "$(basename "$d")-${TAG}.zip"; done
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < v2/VERSION)"
          notes="$(awk -v v="$v" '$0 ~ "^## "v" " {on=1; print; next} on && /^## / {exit} on {print}' v2/CHANGELOG.md)"
          gh release create "${TAG}" FindingObjects-*-"${TAG}".zip --target "${GITHUB_SHA}" \
            --title "Finding Objects ${TAG}" --notes "${notes:-See v2/CHANGELOG.md}"
