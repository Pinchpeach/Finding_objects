name: Validate STAR WD Classifier

on:
  workflow_dispatch:
  push:
    paths:
      - v2/Classifier/collect_star_gaia.py
      - v2/Classifier/train_validate_star_wd.py
      - v2/Classifier/star_truth.csv
      - .github/workflows/validate-star-wd-classifier.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib astropy astroquery
      - name: Crossmatch STAR truth to Gaia DR3
        run: python v2/Classifier/collect_star_gaia.py
      - name: Train and validate WD classifier
        run: python v2/Classifier/train_validate_star_wd.py --features v2/Classifier/star_gaia_features.csv --out v2/Classifier/star_wd_eval
      - name: Show metrics
        run: |
          cat v2/Classifier/star_wd_eval/metrics.json
          echo "--- baseline confusion ---"
          cat v2/Classifier/star_wd_eval/baseline_confusion.csv
          echo "--- learned confusion ---"
          cat v2/Classifier/star_wd_eval/learned_confusion.csv
          echo "--- classification report ---"
          cat v2/Classifier/star_wd_eval/classification_report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: star-wd-classifier-eval
          path: |
            v2/Classifier/star_gaia_features.csv
            v2/Classifier/star_wd_eval/
          retention-days: 30
