name: v2 controller NGC4522 test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/Get_data/**'
      - '.github/workflows/v2_controller_ngc4522_test.yml'

permissions:
  contents: write

concurrency:
  group: v2-controller-ngc4522-test
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pandas requests astropy astroquery
      - name: Run controller on NGC4522 30 arcsec field
        run: python -u v2/Get_data/controller.py --ra 188.4155 --dec 9.1751 --radius 0.5
      - name: Validate current Gaia schema
        run: |
          python - <<'PY'
          import glob,pandas as pd
          paths=glob.glob("v2/rawdata/gaia_dr3_ra188p4155_dec9p1751_r0p5arcmin.csv")
          assert len(paths)==1
          d=pd.read_csv(paths[0],nrows=1)
          required={
            "classprob_dsc_combmod_star","classprob_dsc_combmod_whitedwarf",
            "mass_flame","age_flame","evolstage_flame",
            "in_vari_compact_companion","in_vari_agn"
          }
          missing=sorted(required-set(d.columns))
          assert not missing, f"stale/incomplete Gaia controller output: {missing}"
          print("Gaia controller schema OK",len(d.columns),"columns")
          PY
      - name: Commit controller test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/rawdata
          if ! git diff --cached --quiet; then
            git commit -m "Test v2 controller on NGC4522"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-controller-ngc4522-test
          path: v2/rawdata/
