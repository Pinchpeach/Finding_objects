name: v2 controller NGC4522 test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/Get_data/controller.py'
      - '.github/workflows/v2_controller_ngc4522_test.yml'

permissions:
  contents: write

concurrency:
  group: v2-controller-ngc4522-test
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pandas requests astropy astroquery
      - name: Run controller on NGC4522 30 arcsec field
        run: python -u v2/Get_data/controller.py --ra 188.4155 --dec 9.1751 --radius 0.5
      - name: Commit controller test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/rawdata
          if ! git diff --cached --quiet; then
            git commit -m "Test v2 controller on NGC4522"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-controller-ngc4522-test
          path: v2/rawdata/
