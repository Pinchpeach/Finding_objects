name: v2 controller NGC4522 test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/Get_data/**'
      - 'v2/tests/**'
      - '.github/workflows/v2_controller_ngc4522_test.yml'
  push:
    branches: [main]
    paths:
      - 'v2/Get_data/controller.py'
      - 'v2/tests/**'
      - '.github/workflows/v2_controller_ngc4522_test.yml'

permissions:
  contents: write

concurrency:
  group: v2-controller-ngc4522-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTROLLER_OUT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'v2/rawdata' || 'v2/controller_test_output' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pandas requests astropy astroquery
      - name: Test chunk coverage and failure isolation
        run: python -m unittest discover -s v2/tests -v
      - name: Collect NGC4522 in chunks
        run: python -u v2/Get_data/controller.py --ra 188.4155 --dec 9.1751 --radius 0.5 --chunk-radius 0.36 --out-dir "$CONTROLLER_OUT"
      - name: Verify live collection summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd
          from astropy.coordinates import SkyCoord
          import astropy.units as u
          summary = pd.read_csv(Path(os.environ['CONTROLLER_OUT']) / 'collection_summary_ra188p4155_dec9p1751_r0p5arcmin.csv')
          assert len(summary) == 19
          assert (summary.chunks_planned > 1).all()
          assert (summary.chunks_attempted == summary.chunks_planned).all()
          assert (summary.chunks_succeeded + summary.chunks_failed == summary.chunks_attempted).all()
          assert (summary.status.isin(['ok', 'partial']) & (summary.rows > 0)).any(), summary.to_string()
          for row in summary.itertuples():
              if pd.notna(row.output_file):
                  data = pd.read_csv(Path('v2') / row.output_file, dtype={'catalog_object_id': str})
                  assert len(data) == row.rows
                  assert not data.dropna(subset=['catalog_object_id']).duplicated(['catalog', 'catalog_object_id']).any()
                  points = SkyCoord(data.ra.to_numpy() * u.deg, data.dec.to_numpy() * u.deg)
                  assert (SkyCoord(188.4155 * u.deg, 9.1751 * u.deg).separation(points).arcmin <= 0.5 + 1e-8).all()
          print(summary.to_string(index=False))
          PY
      - name: Commit controller test data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/rawdata
          if ! git diff --cached --quiet; then
            git commit -m "Test v2 controller on NGC4522"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-controller-ngc4522-test
          path: ${{ env.CONTROLLER_OUT }}/
