name: Evaluate Radio X-ray Model
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/benchmark/train_validate_classifier.py'
      - '.github/workflows/evaluate-radio-xray-model.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn joblib
      - name: Download validated radio/X-ray catalog artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rx-catalog-*
          path: v2/benchmark/radio_xray_downloaded
          run-id: 36289818322
          github-token: ${{ github.token }}
      - name: Build manifest and validate
        run: python v2/benchmark/validate_catalog_truth.py --truth v2/benchmark/radio_xray_truth/ground_truth.csv --catalog-root v2/benchmark/radio_xray_downloaded --out v2/benchmark/radio_xray_ready --allow-unbalanced
      - name: Optical IR UV baseline
        run: python v2/benchmark/train_validate_classifier.py --truth v2/benchmark/radio_xray_truth/ground_truth.csv --catalog-root v2/benchmark/radio_xray_downloaded --manifest v2/benchmark/radio_xray_ready/benchmark_manifest.csv --out v2/benchmark/radio_xray_ready/model_eval_baseline --exclude-native-rx
      - name: Radio X-ray enriched
        run: python v2/benchmark/train_validate_classifier.py --truth v2/benchmark/radio_xray_truth/ground_truth.csv --catalog-root v2/benchmark/radio_xray_downloaded --manifest v2/benchmark/radio_xray_ready/benchmark_manifest.csv --out v2/benchmark/radio_xray_ready/model_eval_radio_xray
      - uses: actions/upload-artifact@v4
        with:
          name: radio-xray-model-comparison
          path: v2/benchmark/radio_xray_ready/
          retention-days: 30
