name: v2 u-band photometry at benchmark positions

# 2.36.0 experiment: SDSS DR16, Stripe 82 co-add, KiDS DR4 and SkyMapper DR4
# u-band photometry for the benchmark truth sets (CDS XMatch, one request per
# set and survey), committed to v2/benchmark/u_band/ for local measurement.
on:
  workflow_dispatch:
  push:  # experiment branch only; removed before merging (dispatch needs the file on main)
    paths:
      - .github/workflows/v2_u_band.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy requests astropy astroquery
      - run: python -u .github/scripts/collect_u_band.py v2/benchmark/u_band
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/u_band
          git commit -m "u-band photometry at benchmark positions (CDS XMatch)" || exit 0
          bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
