name: v2 nebula catalogue probe

# 2.42.0: column names and coverage of the young-star membership catalogues
# and the Gaia astrometric-fidelity table before writing collectors (the
# cloud session cannot reach VizieR or GAVO).  Nothing is committed.
on:
  workflow_dispatch:
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - .github/workflows/v2_nebula_probe.yml
      - .github/scripts/probe_nebula_catalogs.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q numpy astropy astroquery pyvo
      - run: python -u .github/scripts/probe_nebula_catalogs.py
