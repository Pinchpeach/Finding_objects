name: AGB chemistry truth (GCVS LPVs)

# GCVS Miras / semiregulars / irregulars with literature spectral types
# (M -> O-rich, C/R/N -> C-rich) with Gaia, 2MASS, AllWISE, Gaia LPV
# photometry: dust-free O-rich giants that the Suh (2021) set lacks.
# Manual only (2.24.0): it rewrites preserved benchmark / truth data, which
# must change only on purpose (an automatic run on a code push replaced the
# DESI benchmark with a partial re-collection on 2026-10-14).
on:
  workflow_dispatch:
concurrency:
  group: agb-gcvs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery
      - name: Build
        run: python -u v2/benchmark/build_agb_gcvs_truth.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/agb_truth
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "AGB chemistry truth from GCVS LPVs with spectral types"
          bash .github/scripts/push_with_retry.sh
