name: v2 AGB catalog smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/Get_data/agb_suh2021.py'
      - 'v2/Classifier/axes/physical.py'
      - '.github/workflows/v2_agb_catalog_smoke.yml'

concurrency:
  group: v2-agb-catalog-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas astropy astroquery
      - name: Round-trip a real Suh 2021 AGB catalogue row
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from astroquery.vizier import Vizier

          # Seed the test from an actual catalogue row instead of assuming a
          # particular sky field contains an entry.
          tables=Vizier(columns=["RAJ2000","DEJ2000"],row_limit=1).get_catalogs("J/ApJS/256/43/table9")
          assert tables and len(tables[0])==1, "could not obtain Suh 2021 table9 seed row"
          seed=tables[0].to_pandas().iloc[0]
          ra=float(seed["RAJ2000"]); dec=float(seed["DEJ2000"])
          print("seed",ra,dec)

          p=Path("v2/Get_data/agb_suh2021.py")
          s=importlib.util.spec_from_file_location("agb",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          d=m.fetch(ra,dec,0.5)
          print("rows",len(d))
          print(d[["catalog_object_id","ra","dec","agb_subclass"]].head(10).to_string(index=False))
          assert len(d)>0, "Suh AGB cone query failed to recover its own catalogue seed"
          assert set(d["agb_subclass"]).issubset({"OAGB_IRAS","CAGB_IRAS","OAGB_WISE","CAGB_WISE"})
          m.save(d,Path("/tmp/agb_roundtrip.csv"))
          PY
      - name: Validate physical route
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("v2/Classifier/axes/physical.py")
          s=importlib.util.spec_from_file_location("physical",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          r=m.classify({"catalogs":"Suh 2021 AGB Catalog","agb_subclass":"OAGB_WISE","association_confidence__suh_2021_agb_catalog":0.9})
          print(r)
          assert r["label"]=="AGB"
          assert r["status"]=="SUH2021_AGB_CATALOG_MATCH"
          PY
