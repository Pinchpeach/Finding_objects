name: Bright-star truth (APOGEE, ESP-ELS, LPV LAMOST)

# Truth for the spectroscopic rules the faint benchmark cannot test (2.6.2):
# APOGEE DR17 log g / [Fe/H] vs Gaia GSP-Spec / GSP-Phot / LAMOST, ESP-ELS
# classes vs SIMBAD types, field-LPV chemistry vs LAMOST spectra.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: comma-separated parts (apogee,els,lpv)
        default: apogee,els,lpv
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - v2/benchmark/build_bright_truth.py

concurrency:
  group: bright-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery pyvo
      - name: Build
        run: python -u v2/benchmark/build_bright_truth.py --parts "${{ inputs.parts || 'apogee,els,lpv' }}"
      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/bright_truth || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Bright-star truth (APOGEE, ESP-ELS, LPV LAMOST)"
          bash .github/scripts/push_with_retry.sh
