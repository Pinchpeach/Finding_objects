name: Validate WD Subtype Gaia XP External

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "re-collect and replace the committed SDSS tables (true/false)"
        default: "false"
  push:
    paths:
      - v2/Classifier/build_sdss_wd_subtype_external_truth.py
      - v2/Classifier/validate_wd_subtype_xp_external.py
      - .github/workflows/validate-wd-subtype-xp-external.yml

# 2.53.0: inputs from the repository (v2/Classifier/wd_subtype_xp_data/)
# instead of expiring artifacts.  The LAMOST training table comes from
# validate-wd-subtype-xp.yml; the SDSS external truth / Gaia / XP tables are
# collected and committed only when absent, so a code push validates on the
# committed data and never replaces it.  200 per class is the primary external
# benchmark (run 36304882268: 213 XP rows) that the deploy-model check in
# build-wd-subtype-xp-model.yml (>= 80 rows at p >= 0.90) was set on; 100 per
# class was the compact confirmation run (105 rows, 63-65 at p >= 0.90).
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    timeout-minutes: 90
    env:
      DATA: v2/Classifier/wd_subtype_xp_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn astropy astroquery
      - name: LAMOST XP training data (committed by validate-wd-subtype-xp.yml)
        run: |
          test -f "$DATA/wd_subtype_xp.csv.gz" || { echo "missing $DATA/wd_subtype_xp.csv.gz: run validate-wd-subtype-xp.yml first"; exit 1; }
          python - <<'PY'
          import os, pandas as pd
          d=pd.read_csv(os.environ["DATA"]+"/wd_subtype_xp.csv.gz")
          print("LAMOST XP rows",len(d),d.star_truth_class.value_counts().to_dict())
          PY
      - name: SDSS DR14 DA DB external truth, Gaia crossmatch and XP (only when not committed)
        run: |
          if [ "${{ github.event.inputs.refresh }}" != "true" ] && [ -f "$DATA/sdss_wd_subtype_xp.csv.gz" ]; then
            echo "using the committed $DATA/sdss_wd_subtype_xp.csv.gz"
            exit 0
          fi
          python v2/Classifier/build_sdss_wd_subtype_external_truth.py --per-class 200 --min-sn 10 --out "$DATA/sdss_wd_subtype_external_truth.csv.gz"
          python v2/Classifier/collect_star_gaia.py --truth "$DATA/sdss_wd_subtype_external_truth.csv.gz" --out "$DATA/sdss_wd_subtype_gaia.csv.gz" --min-matches 90
          python v2/Classifier/collect_gaia_xp_coefficients.py --features "$DATA/sdss_wd_subtype_gaia.csv.gz" --out "$DATA/sdss_wd_subtype_xp.csv.gz" --batch-size 40
      - name: External DA DB validation
        run: python v2/Classifier/validate_wd_subtype_xp_external.py --lamost-xp "$DATA/wd_subtype_xp.csv.gz" --sdss-xp "$DATA/sdss_wd_subtype_xp.csv.gz" --out v2/Classifier/wd_subtype_xp_external_eval
      - name: Show external metrics
        run: |
          cat v2/Classifier/wd_subtype_xp_external_eval/metrics.json
          echo "--- external confusion ---"
          cat v2/Classifier/wd_subtype_xp_external_eval/external_confusion.csv
      - name: Commit the SDSS external tables (new or refreshed)
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DATA"
          git diff --cached --quiet && exit 0
          git commit -m "WD subtype XP data: SDSS DR14 DA/DB external truth, Gaia crossmatch and XP coefficients"
          bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wd-subtype-xp-external-eval
          path: |
            ${{ env.DATA }}/sdss_wd_subtype_external_truth.csv.gz
            ${{ env.DATA }}/sdss_wd_subtype_gaia.csv.gz
            ${{ env.DATA }}/sdss_wd_subtype_xp.csv.gz
            v2/Classifier/wd_subtype_xp_external_eval/
          retention-days: 30
