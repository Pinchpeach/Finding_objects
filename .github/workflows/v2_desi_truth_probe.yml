name: v2 DESI DR1 truth probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v2_desi_truth_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas astropy astroquery
      - name: Inspect V/161 (DESI DR1 redshift catalog)
        run: |
          python - <<'PY'
          from astroquery.vizier import Vizier
          from astropy.coordinates import SkyCoord
          import astropy.units as u
          t=Vizier(columns=["**"],row_limit=5).get_catalogs("V/161")
          for tab in t:
              print(tab.meta.get("name"), len(tab)); print(tab.colnames)
              for c in tab.colnames: print("  ",c,tab[c].unit,"|",tab[c].description)
              print(tab[:3])
          r=Vizier(columns=["**"],row_limit=20).query_region(SkyCoord(150.1*u.deg,2.2*u.deg),radius=2*u.arcmin,catalog="V/161")
          print(r)
          PY
