name: Test Classifier Routing
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/Classifier/**'
      - '.github/workflows/test-classifier-routing.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Build synthetic coarse input
        run: |
          python - <<'PY'
          import pandas as pd
          pd.DataFrame([
            {"object_id":"s1","primary_class":"STAR","classprob_dsc_combmod_whitedwarf":0.92,"classprob_dsc_combmod_binarystar":0.01,
             "best_class_name":"RR","best_class_score":0.88,"teff_gspphot":11500,"logg_gspphot":8.0,
             "wd_xp_subtype_prediction":"DA","wd_xp_subtype_confidence":0.96},
            {"object_id":"s2","primary_class":"STAR","classprob_dsc_combmod_whitedwarf":0.02,"classprob_dsc_combmod_binarystar":0.91,
             "best_class_name":"ECL","best_class_score":0.81},
            {"object_id":"s3","primary_class":"STAR","parallax":10.0,"parallax_error":1.0,
             "phot_g_mean_mag":15.0,"bp_rp":0.0,
             "wd_xp_subtype_prediction":"DB","wd_xp_subtype_confidence":0.85},
            {"object_id":"s4","primary_class":"STAR","parallax":10.0,"parallax_error":1.0,
             "phot_g_mean_mag":15.0,"bp_rp":0.0,"classprob_dsc_combmod_star":0.95},
            {"object_id":"g1","primary_class":"GALAXY"},
            {"object_id":"q1","primary_class":"QSO","rx_radio_peak":2.5},
            {"object_id":"u1","primary_class":"UNKNOWN"},
          ]).to_csv("/tmp/coarse.csv",index=False)
          PY
      - name: Validate and route
        run: |
          python v2/Classifier/01_prepare_input.py --input /tmp/coarse.csv --out /tmp/prepared.csv
          python v2/Classifier/control.py --input /tmp/prepared.csv --out /tmp/classified.csv
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("/tmp/classified.csv")
          assert list(d.detailed_class)==["WHITE_DWARF_CANDIDATE","BINARY_CANDIDATE","WHITE_DWARF_CANDIDATE","UNRESOLVED","UNRESOLVED","UNRESOLVED","UNRESOLVED"]
          assert d.loc[d.object_id.eq("s1"),"variability_class_legacy"].iloc[0]=="RR"
          assert d.loc[d.object_id.eq("s2"),"variability_class_legacy"].iloc[0]=="ECL"
          assert d.loc[d.object_id.eq("s1"),"variability_class"].iloc[0]=="RR_LYRAE"
          assert d.loc[d.object_id.eq("s2"),"variability_class"].iloc[0]=="ECLIPSING"
          assert d.loc[d.object_id.eq("s1"),"spectral_type"].iloc[0]=="DA"
          assert d.loc[d.object_id.eq("s3"),"spectral_type"].iloc[0]=="UNRESOLVED"
          print(d[["object_id","primary_class","detailed_class","stellar_family","variability_class_legacy","variability_class","spectral_type"]].to_string(index=False))
          PY
