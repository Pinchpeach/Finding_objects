name: v2 archive column probe

# Checks against the live archives the column names the 2.16.0-2.19.0
# association / stellar / phenomenon code reads but that could not be verified
# from the development container (no archive access there).
on:
  workflow_dispatch:
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - .github/workflows/v2_column_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery pyvo requests
      - name: VizieR columns (Chandra CSC 2, eRASS1, 4XMM, HASH, Gaia LPV)
        continue-on-error: true
        run: |
          python - <<'PY'
          import collections
          from astroquery.vizier import Vizier
          from astropy.coordinates import SkyCoord
          import astropy.units as u
          probes = {
              "IX/57/csc2master": (150.1, 2.2, 10),       # COSMOS
              "J/A+A/682/A34": (150.1, 2.2, 10),
              "IX/74/4xmmdr13s": (150.1, 2.2, 10),
              "V/163/pnmain": (283.396, 33.029, 30),       # Ring nebula
              "I/358/vlpv": (266.4, -29.0, 5),
          }
          for cat, (ra, dec, r) in probes.items():
              try:
                  t = Vizier(columns=["**"], row_limit=5).query_region(SkyCoord(ra*u.deg, dec*u.deg), radius=r*u.arcmin, catalog=cat)
                  print("==", cat, [len(x) for x in t])
                  for x in t[:1]:
                      for c in x.colnames:
                          print("   ", c, "|", x[c].unit, "|", (x[c].description or "")[:70])
                      print(x[:3])
              except Exception as exc:
                  print("==", cat, "ERROR", repr(exc))
          # HASH status values (what pn_catalog_status holds)
          try:
              t = Vizier(columns=["**"], row_limit=5000).get_catalogs("V/163/pnmain")[0]
              for c in t.colnames:
                  if "stat" in c.lower():
                      print("HASH status column", c, collections.Counter(map(str, t[c])).most_common(15))
          except Exception as exc:
              print("HASH status ERROR", repr(exc))
          PY
      - name: Pan-STARRS epochMean and Legacy Surveys astrometry columns via the collectors
        continue-on-error: true
        run: |
          cd v2/Get_data
          python - <<'PY'
          import panstarrs1, desi_legacy
          d = panstarrs1.fetch(150.1, 2.2, 0.5)
          print("PS1 rows", len(d), "epochMean" in d.columns, d.get("epochMean", None) is not None and d["epochMean"].describe().to_dict())
          print("PS1 raMeanErr arcsec median", d["raMeanErr"].median())
          l = desi_legacy.fetch(150.1, 2.2, 0.5)
          print("LS rows", len(l), [c for c in ("ra_ivar", "dec_ivar", "ref_epoch", "legacy_astrometry_query_status") if c in l.columns])
          if "ra_ivar" in l:
              import numpy as np
              err = 3600 / np.sqrt(l["dec_ivar"].astype(float))
              print("LS dec error arcsec median", float(np.nanmedian(err)), "ref_epoch values", l["ref_epoch"].value_counts().head().to_dict())
          PY
      - name: Collectors end to end (association profiles read these columns)
        continue-on-error: true
        run: |
          cd v2/Get_data
          python - <<'PY'
          import sys
          sys.path.insert(0, "../Preprocess")
          import association_model as am
          import chandra, erosita, xmm, hash_pn, gaia_dr3_variability_sos_vizier as sos
          for mod, cat, args in ((chandra, "Chandra CSC 2.0", (150.1, 2.2, 5)), (erosita, "eROSITA eRASS1", (150.1, 2.2, 10)),
                                 (xmm, "XMM 4XMM-DR13", (150.1, 2.2, 5)), (hash_pn, "HASH PN Catalog", (283.396, 33.029, 5))):
              try:
                  d = mod.fetch(*args)
                  errs = [am.infer_poserr_arcsec(cat, r) for r in d.head(200).to_dict("records")]
                  prof = am.profile_for(cat).fallback_poserr_arcsec
                  print(cat, "rows", len(d), "poserr median", sorted(errs)[len(errs)//2] if errs else None,
                        "fallback used", sum(abs(e - prof) < 1e-9 for e in errs), "of", len(errs),
                        "status" if cat.startswith("HASH") else "", d.get("pn_catalog_status", "").tolist()[:5] if cat.startswith("HASH") else "")
              except Exception as exc:
                  print(cat, "ERROR", repr(exc))
          try:
              d = sos.fetch(266.4, -29.0, 5, kinds=("lpv",))
              print("LPV rows", len(d), "mdwlrp filled", int(d["gaia_lpv_median_delta_wl_rp"].notna().sum()) if "gaia_lpv_median_delta_wl_rp" in d else "missing")
          except Exception as exc:
              print("LPV ERROR", repr(exc))
          PY
