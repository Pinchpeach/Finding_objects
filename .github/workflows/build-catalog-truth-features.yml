name: Build Catalog Truth Features
env:
  BENCHMARK_TARGET_SIZE: '9999'
on:
  push:
    paths:
      - 'v2/benchmark/collect_catalog_truth.py'
      - 'v2/benchmark/truth_data/ground_truth.csv'
      - 'v2/benchmark/validate_catalog_truth.py'
      - 'v2/benchmark/train_validate_classifier.py'
      - 'v2/benchmark/evaluate_rule_baseline.py'
      - 'v2/Get_data/*.py'
      - '.github/workflows/build-catalog-truth-features.yml'
  workflow_dispatch:
    inputs:
      limit_per_class:
        description: 'Targets per class (blank = all truth objects)'
        required: false
        default: ''
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        catalog: [gaia_dr3, panstarrs1, allwise, twomass, galex, desi_legacy, nvss, first, lotss, vlass, chandra, xmm, erosita]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn joblib requests astropy astroquery
      - name: Cross-query ${{ matrix.catalog }}
        run: |
          L="${{ github.event.inputs.limit_per_class }}"
          if [ -n "$L" ]; then
            python v2/benchmark/collect_catalog_truth.py --catalog "${{ matrix.catalog }}" --workers 8 --limit-per-class "$L"
          else
            python v2/benchmark/collect_catalog_truth.py --catalog "${{ matrix.catalog }}" --workers 8
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-truth-${{ matrix.catalog }}
          path: v2/benchmark/catalog_data/
          if-no-files-found: warn
          retention-days: 14
  validate:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn joblib
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-truth-*
          path: v2/benchmark/downloaded_catalogs
      - name: Validate catalog truth products
        run: python v2/benchmark/validate_catalog_truth.py --truth v2/benchmark/truth_data/ground_truth.csv --catalog-root v2/benchmark/downloaded_catalogs --out v2/benchmark/benchmark_ready
      - name: Evaluate current rule classifier baseline
        run: python v2/benchmark/evaluate_rule_baseline.py --truth v2/benchmark/truth_data/ground_truth.csv --catalog-root v2/benchmark/downloaded_catalogs --manifest v2/benchmark/benchmark_ready/benchmark_manifest.csv --out v2/benchmark/benchmark_ready/model_eval
      - name: Train and evaluate calibrated multi-survey classifier
        run: python v2/benchmark/train_validate_classifier.py --truth v2/benchmark/truth_data/ground_truth.csv --catalog-root v2/benchmark/downloaded_catalogs --manifest v2/benchmark/benchmark_ready/benchmark_manifest.csv --out v2/benchmark/benchmark_ready/model_eval
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-ready
          path: v2/benchmark/benchmark_ready/
          retention-days: 14
