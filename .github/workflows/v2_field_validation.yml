name: v2 real-field end-to-end validation

# Runs v2/pipeline.py (collection + association + classification) on a sky
# field and compares coarse classes with DESI DR1 spectroscopic classes found
# in the same field. DESI spectra are not used as classification evidence, so
# they are an independent check of the whole chain, including association.
# Default field (RA 245, Dec +43) lies outside the RA windows used to build the
# DESI truth set that the fusion weights were trained on.
on:
  workflow_dispatch:
    inputs:
      ra: {description: "RA (deg)", default: "245.0"}
      dec: {description: "Dec (deg)", default: "43.0"}
      radius: {description: "radius (arcmin)", default: "3"}
  push:
    paths:
      - .github/workflows/v2_field_validation.yml

permissions:
  contents: read

jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RA: ${{ github.event.inputs.ra || '245.0' }}
      DEC: ${{ github.event.inputs.dec || '43.0' }}
      RADIUS: ${{ github.event.inputs.radius || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests astropy astroquery pyvo
      - name: Pipeline
        run: python -u v2/pipeline.py --ra $RA --dec $DEC --radius $RADIUS --work /tmp/field
      - name: Compare with DESI DR1 spectroscopy in the field
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("/tmp/field/classified_objects.csv",low_memory=False)
          print(pd.read_csv("/tmp/field/pipeline_summary.csv").to_string(index=False))
          print("objects",len(d)); print(d.classification_status.value_counts().to_string())
          col="desi_dr1_spectroscopy__OType"
          if col not in d.columns: raise SystemExit("no DESI spectra in this field")
          s=d[d[col].notna()].copy(); s["truth"]=s[col].astype(str).str.strip()
          # Standard DESI good-redshift cuts for the comparison truth.
          s=s[pd.to_numeric(s.get("desi_dr1_spectroscopy__ZWARN"),errors="coerce").eq(0)&(pd.to_numeric(s.get("desi_dr1_spectroscopy__delChi2"),errors="coerce")>25)]
          s=s[s.truth.isin(["STAR","GALAXY","QSO"])]
          print("objects with DESI spectra:",len(s))
          print(pd.crosstab(s.truth,s.primary_class,margins=True).to_string())
          c=s.primary_class.ne("UNKNOWN")
          print(f"coverage={c.mean():.3f} accuracy_when_classified={(s.primary_class==s.truth)[c].mean():.3f}")
          import json
          print("\n== catalogs of NO_EVIDENCE objects"); print(d[d.classification_status.eq("NO_EVIDENCE")].catalogs.value_counts().head(12).to_string())
          print("\n== DESI-spectra objects left UNKNOWN")
          u=s[s.primary_class.eq("UNKNOWN")]
          for _,r in u.head(15).iterrows():
              ev=json.loads(r.evidence_json) if isinstance(r.evidence_json,str) else []
              print(r.truth, r.classification_status, r.catalogs, "| n_ev",len(ev), "| assoc_status",r.get("association_ambiguous"),
                    "| ls_type",r.get("desi_legacy_surveys_dr10__type"), "| ls_r_flux",r.get("desi_legacy_surveys_dr10__flux_r"),
                    "| host_r",r.get("host_elliptical_radius"))
          a=pd.read_csv("/tmp/field/source_association.csv",low_memory=False)
          print("\n== association status by catalog"); print(pd.crosstab(a.catalog,a.association_status).to_string())
          import glob, numpy as np
          ls=pd.read_csv(glob.glob("/tmp/field/raw/desi_legacy_*.csv")[0],low_memory=False)
          ds=pd.read_csv(glob.glob("/tmp/field/raw/desi_spectroscopy_*.csv")[0],low_memory=False)
          print("\nLS rows",len(ls),"DESI rows",len(ds), "LS release values", ls.get("release",pd.Series()).value_counts().head().to_dict())
          cosd=np.cos(np.radians(43.0))
          sep=[np.min(np.hypot((ls.ra-r)*cosd,ls.dec-d))*3600 for r,d in zip(ds.ra,ds.dec)]
          print("nearest-LS separation for DESI rows (arcsec):", np.percentile(sep,[10,50,90,100]).round(2), "n>2arcsec:", int((np.array(sep)>2).sum()))
          print("LS ra/dec span", ls.ra.min(), ls.ra.max(), ls.dec.min(), ls.dec.max())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-validation
          path: /tmp/field/*.csv
          retention-days: 7
