name: v2 real-field end-to-end validation

# Runs v2/pipeline.py (collection + association + classification) on a sky
# field and compares coarse classes with DESI DR1 spectroscopic classes found
# in the same field. DESI spectra are not used as classification evidence, so
# they are an independent check of the whole chain, including association.
# Default field (RA 245, Dec +43) lies outside the RA windows used to build the
# DESI truth set that the fusion weights were trained on.
on:
  workflow_dispatch:
    inputs:
      ra: {description: "RA (deg)", default: "245.0"}
      dec: {description: "Dec (deg)", default: "43.0"}
      radius: {description: "radius (arcmin)", default: "3"}
  push:
    paths:
      - .github/workflows/v2_field_validation.yml

permissions:
  contents: read

jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RA: ${{ github.event.inputs.ra || '245.0' }}
      DEC: ${{ github.event.inputs.dec || '43.0' }}
      RADIUS: ${{ github.event.inputs.radius || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests astropy astroquery pyvo
      - name: Pipeline
        run: python -u v2/pipeline.py --ra $RA --dec $DEC --radius $RADIUS --work /tmp/field
      - name: Compare with DESI DR1 spectroscopy in the field
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("/tmp/field/classified_objects.csv",low_memory=False)
          print(pd.read_csv("/tmp/field/pipeline_summary.csv").to_string(index=False))
          print("objects",len(d)); print(d.classification_status.value_counts().to_string())
          col="desi_dr1_spectroscopy__OType"
          if col not in d.columns: raise SystemExit("no DESI spectra in this field")
          s=d[d[col].notna()].copy(); s["truth"]=s[col].astype(str).str.strip()
          # Standard DESI good-redshift cuts for the comparison truth.
          s=s[pd.to_numeric(s.get("desi_dr1_spectroscopy__ZWARN"),errors="coerce").eq(0)&(pd.to_numeric(s.get("desi_dr1_spectroscopy__delChi2"),errors="coerce")>25)]
          s=s[s.truth.isin(["STAR","GALAXY","QSO"])]
          # Never score objects that are in the benchmark truth sets: they may
          # be in the colour-kNN reference or the fusion training split.
          import numpy as np
          bench=pd.concat([pd.read_csv(f)[["ra","dec"]] for f in ("v2/benchmark/desi_external/truth.csv","v2/benchmark/truth_data/ground_truth.csv")])
          ora=pd.to_numeric(s.get("object_ra",s.get("ra")),errors="coerce").to_numpy(); ode=pd.to_numeric(s.get("object_dec",s.get("dec")),errors="coerce").to_numpy()
          near=bench[(abs(bench.dec-np.nanmedian(ode))<0.2)]
          inb=np.array([((np.hypot((near.ra-r)*np.cos(np.radians(d)),near.dec-d)*3600)<1.5).any() if np.isfinite(r) else False for r,d in zip(ora,ode)])
          print("benchmark objects excluded from scoring:",int(inb.sum())); s=s[~inb]
          print("objects with DESI spectra:",len(s))
          print(pd.crosstab(s.truth,s.primary_class,margins=True).to_string())
          c=s.primary_class.ne("UNKNOWN")
          print(f"coverage={c.mean():.3f} accuracy_when_classified={(s.primary_class==s.truth)[c].mean():.3f}")
          if "parent_object_id" in s.columns and s.parent_object_id.notna().any():
              # A part of a large galaxy (e.g. a nucleus fibre) is that galaxy: score it with its host's class.
              host_cls=d.set_index("object_id").primary_class
              eff=s.primary_class.where(s.parent_object_id.isna(), s.parent_object_id.map(host_cls))
              ce=eff.ne("UNKNOWN")
              print(f"parts scored by their host ({int(s.parent_object_id.notna().sum())}): coverage={ce.mean():.3f} accuracy_when_classified={(eff==s.truth)[ce].mean():.3f}")
          import importlib.util
          spec=importlib.util.spec_from_file_location("units","v2/Preprocess/units.py"); units=importlib.util.module_from_spec(spec); spec.loader.exec_module(units)
          pts=d[d.get("desi_legacy_surveys_dr10__type",pd.Series(index=d.index)).astype(str).eq("PSF")]
          print("\n== why objects stay UNKNOWN (top-level)")
          tl=d[d.parent_object_id.isna()] if "parent_object_id" in d.columns else d
          unk=tl[tl.primary_class.eq("UNKNOWN")]
          print("UNKNOWN", len(unk), "/", len(tl)); print(unk.classification_status.value_counts().to_string())
          if "unknown_reason" in unk.columns: print("unknown_reason:", unk.unknown_reason.str.replace(r"[0-9.]+","#",regex=True).value_counts().head(12).to_dict())
          if "simbad__simbad_reference_status" in d.columns: print("SIMBAD reference status:", d.simbad__simbad_reference_status.value_counts().to_dict())
          ncat=unk.catalogs.fillna("").str.count(r"\|")+1
          print("catalogue count:", ncat.value_counts().sort_index().to_dict())
          print("SIMBAD otype of UNKNOWN:", unk.get("simbad__otype",pd.Series(dtype=object)).value_counts().head(25).to_dict())
          print("NED Type of UNKNOWN:", unk.get("ned__Type",pd.Series(dtype=object)).value_counts().head(15).to_dict())
          for cat,col in (("Pan-STARRS1 DR2 MeanObject","std_mag__ps1_r"),("DESI Legacy Surveys DR10","std_mag__ls_r"),("SDSS DR18 PhotoObj","std_mag__sdss_r"),("AllWISE","std_mag__wise_w1"),("GALEX AIS","std_mag__galex_nuv")):
              one=unk[unk.catalogs.eq(cat)]
              if len(one) and col in one:
                  m=pd.to_numeric(one[col],errors="coerce")
                  print(f"only {cat}: n={len(one)} mag quartiles={m.quantile([.25,.5,.75]).round(2).tolist()}")
          ps=unk[unk.catalogs.eq("Pan-STARRS1 DR2 MeanObject")]
          if len(ps) and "pan_starrs1_dr2_meanobject__nDetections" in ps:
              print("  PS1-only nDetections quartiles", pd.to_numeric(ps["pan_starrs1_dr2_meanobject__nDetections"],errors="coerce").quantile([.25,.5,.75]).tolist(),
                    "| bands with PSF mag:", ps[[f"std_mag__ps1_{b}" for b in "grizy"]].notna().sum(axis=1).value_counts().to_dict())
          ls_=unk[unk.catalogs.eq("DESI Legacy Surveys DR10")]
          if len(ls_):
              print("  LS-only type:", ls_.get("desi_legacy_surveys_dr10__type",pd.Series(dtype=object)).value_counts().to_dict(),
                    "| g/r/z S/N>5:", [int((1/pd.to_numeric(ls_[f"std_magerr__ls_{b}"],errors="coerce")*1.0857>5).sum()) for b in "grz"])
          print("\n== Solar System objects (2.29.0)")
          print("status SOLAR_SYSTEM:", int(d.classification_status.eq("SOLAR_SYSTEM").sum()),
                "| by rule:", d.loc[d.classification_status.eq("SOLAR_SYSTEM"), "subclass_rule"].value_counts().to_dict())
          one = d[d.catalogs.astype(str).eq("Pan-STARRS1 DR2 MeanObject")]
          fl = pd.to_numeric(one.get("pan_starrs1_dr2_meanobject__objInfoFlag", pd.Series(dtype=float)), errors="coerce")
          print("PS1-only objects", len(one), "| objInfoFlag present", int(fl.notna().sum()),
                "| HAS_SOLSYS_DET", int((fl.fillna(0).astype("int64") & 0x200 > 0).sum()),
                "| MOST_SOLSYS_DET", int((fl.fillna(0).astype("int64") & 0x400 > 0).sum()),
                "| TRANSIENT", int((fl.fillna(0).astype("int64") & 0x100 > 0).sum()))
          allps = pd.to_numeric(d.get("pan_starrs1_dr2_meanobject__objInfoFlag", pd.Series(dtype=float)), errors="coerce").fillna(0).astype("int64")
          print("all objects with PS1 SOLSYS bits:", int((allps & 0x600 > 0).sum()), "by class", d.loc[allps & 0x600 > 0, "primary_class"].value_counts().to_dict())
          sd = d[d.catalogs.astype(str).eq("SDSS DR18 PhotoObj")]
          if "sdss_dr18_photoobj__rowv" in d:
              v = (pd.to_numeric(sd["sdss_dr18_photoobj__rowv"], errors="coerce")**2 + pd.to_numeric(sd["sdss_dr18_photoobj__colv"], errors="coerce")**2)**0.5
              print("SDSS-only objects", len(sd), "| velocity quartiles (deg/day)", v.quantile([.25,.5,.75]).round(3).tolist(), "| 0.05<v<0.5:", int(v.between(0.05, 0.5).sum()))
              # Truth check (2.29.0): known Solar System objects at each SDSS-only
              # candidate's imaging epoch, from IMCCE SkyBoT (Berthier et al. 2006).
              cand = sd[v.between(0.05, 0.5)]
              try:
                  from astroquery.imcce import Skybot
                  from astropy.coordinates import SkyCoord
                  from astropy.time import Time
                  import astropy.units as u
                  for _, r in cand.iterrows():
                      mjd = pd.to_numeric(r.get("sdss_dr18_photoobj__mjd"), errors="coerce")
                      rv, cv, re_, ce = (pd.to_numeric(r.get(f"sdss_dr18_photoobj__{k}"), errors="coerce") for k in ("rowv","colv","rowvErr","colvErr"))
                      vv, sv = (rv**2+cv**2)**0.5, (re_**2+ce**2)**0.5
                      hit = "no epoch"
                      if pd.notna(mjd):
                          try:
                              t = Skybot.cone_search(SkyCoord(r.ra*u.deg, r.dec*u.deg), 60*u.arcsec, Time(mjd, format="mjd"), location="645")
                              ca = next(c for c in t.colnames if c.upper().startswith("RA"))
                              cd = next(c for c in t.colnames if c.upper().startswith("DE"))
                              sep = SkyCoord(t[ca], t[cd], unit="deg").separation(SkyCoord(r.ra*u.deg, r.dec*u.deg)).arcsec
                              i = sep.argmin()
                              hit = f"SkyBoT {t['Name'][i]} at {sep[i]:.1f}\" V={t['V'][i] if 'V' in t.colnames else '?'} (cols {t.colnames[:6]})"
                          except Exception as exc:
                              hit = "SkyBoT none (" + str(exc)[:60] + ")"
                      print(f"  SDSS-only v={vv:.3f}+-{sv:.3f} deg/d r={r.get('std_mag__sdss_r')} type={r.get('sdss_dr18_photoobj__type')} status={r.classification_status} -> {hit}")
              except Exception as exc:
                  print("SkyBoT check failed:", exc)
              # Completeness check: every known Solar System object in the cone at
              # the SDSS imaging epoch, and the pipeline object nearest to it.
              try:
                  import numpy as np
                  ep = pd.to_numeric(d.get("sdss_dr18_photoobj__mjd"), errors="coerce").dropna()
                  if len(ep):
                      import os
                      ra0, dec0, rad = float(os.environ["RA"]), float(os.environ["DEC"]), float(os.environ["RADIUS"])
                      mjd0 = float(ep.mode().iloc[0])
                      t = Skybot.cone_search(SkyCoord(ra0*u.deg, dec0*u.deg), rad*u.arcmin, Time(mjd0, format="mjd"), location="645")
                      ca = next(c for c in t.colnames if c.upper().startswith("RA")); cd = next(c for c in t.colnames if c.upper().startswith("DE"))
                      print(f"known SSOs in the cone at SDSS epoch MJD {mjd0:.4f}: {len(t)}")
                      pos = SkyCoord(d.ra.values*u.deg, d.dec.values*u.deg)
                      for row in t:
                          c = SkyCoord(float(row[ca])*u.deg if not hasattr(row[ca], "unit") else row[ca], float(row[cd])*u.deg if not hasattr(row[cd], "unit") else row[cd])
                          sep = c.separation(pos).arcsec; i = int(np.argmin(sep))
                          print(f"  {row['Name']} V={row['V'] if 'V' in t.colnames else '?'} -> nearest object {sep[i]:.1f}\" catalogs={d.catalogs.iloc[i]} status={d.classification_status.iloc[i]} type={d.get('sdss_dr18_photoobj__type', pd.Series([None]*len(d))).iloc[i]}")
              except Exception as exc:
                  print("SkyBoT field check:", str(exc)[:120])
          else:
              print("SDSS velocity columns absent")
          print("\n== Pan-STARRS1-only objects (2.30.0)")
          try:
              import numpy as np
              from astropy.coordinates import SkyCoord
              import astropy.units as u
              pso = d[d.catalogs.astype(str).eq("Pan-STARRS1 DR2 MeanObject")]
              qf = pd.to_numeric(pso.get("pan_starrs1_dr2_meanobject__qualityFlag"), errors="coerce").fillna(0).astype("int64")
              print("n", len(pso), "| qualityFlag bits:", {b: int((qf & b > 0).sum()) for b in (1,2,4,8,16,32,64,128)})
              nd = pd.to_numeric(pso.get("pan_starrs1_dr2_meanobject__nDetections"), errors="coerce")
              print("nDetections counts:", nd.value_counts().sort_index().head(8).to_dict())
              ls = d[d.catalogs.astype(str).str.contains("DESI Legacy Surveys DR10")]
              import importlib.util
              sp = importlib.util.spec_from_file_location("dq", "v2/detection_quality.py"); dq = importlib.util.module_from_spec(sp); sp.loader.exec_module(dq)
              near, cnt = dq._neighbours(pso, ls, dq.COVERAGE_RADIUS_ARCSEC)
              print("nearest LS object (arcsec) quantiles 10/25/50/75/90:", np.round(np.quantile(near, [.1,.25,.5,.75,.9]), 2).tolist() if len(near) else None,
                    "| within 1\":", int((near<1).sum()), "within 2\":", int((near<2).sum()), "within 5\":", int((near<5).sum()),
                    "| LS neighbours within 60\" median:", float(np.median(cnt)) if len(cnt) else None)
              mags = pso[[f"std_mag__ps1_{b}" for b in "grizy"]].min(axis=1)
              print("brightest PS1 mag quantiles:", mags.quantile([.1,.25,.5,.75,.9]).round(2).tolist())
              print("status UNCONFIRMED:", int(d.classification_status.eq("UNCONFIRMED").sum()), "of", len(d),
                    "| PS1-only not flagged: nDet", nd[~d.loc[pso.index, "classification_status"].eq("UNCONFIRMED")].value_counts().head(6).to_dict())
              print("DESI-spectrum objects flagged UNCONFIRMED (should be 0):",
                    int(d[d.catalogs.astype(str).str.contains("DESI DR1 spectroscopy")].classification_status.eq("UNCONFIRMED").sum()))
          except Exception as exc:
              print("PS1-only diagnostics failed:", exc)
          print("\n== unit harmonisation: same band from two catalogues (point sources; AB after conversion)")
          print(units.consistency(pts))
          print("\n== second-stage sub-class")
          print(d.subclass_status.value_counts().to_string())
          top=d[d.parent_object_id.isna()] if "parent_object_id" in d.columns else d
          print("objects", len(d), "top-level", len(top), "large-galaxy hosts", int((d.get("n_components",0)>0).sum()),
                "| roles", d.get("component_role",pd.Series()).value_counts().to_dict())
          print(top.groupby("primary_class").subclass.apply(lambda x: round(float(x.notna().mean()),3)).to_string())
          print(top.subclass_rule.value_counts().to_string())
          if "subclass_tags" in top.columns:
              tg=top.subclass_tags.dropna().str.split("; ").explode().str.replace(r" \(.*","",regex=True)
              print("attributes:", tg.value_counts().head(20).to_dict())
          st=s[s.truth.eq("STAR")&s.primary_class.eq("STAR")].copy()
          st["desi_type"]=st.get("desi_dr1_spectroscopy__SubType",pd.Series(index=st.index,dtype=object)).astype(str).str.strip().str.upper()
          st["pred"]=st.subclass_code.astype(str).str.split(":").str[1]
          mk=st[st.desi_type.str.fullmatch(r"[OBAFGKML]")&st.pred.str.fullmatch(r"[OBAFGKML]")]
          L="OBAFGKML"
          if len(mk):
              dl=mk.desi_type.map(L.index)-mk.pred.map(L.index)
              print(f"STAR letter vs DESI SubType: n={len(mk)} exact={float((dl==0).mean()):.3f} within1={float((dl.abs()<=1).mean()):.3f}")
              print(pd.crosstab(mk.desi_type,mk.pred).to_string())
              print(mk.groupby("subclass_rule").apply(lambda g: round(float((g.desi_type==g.pred).mean()),3)).to_string())
          wd=st[st.desi_type.eq("WD")]
          if len(wd): print("DESI WD typed STAR:WD:", int(wd.subclass_code.eq("STAR:WD").sum()), "/", len(wd))
          gal=top[top.primary_class.eq("GALAXY")]
          n=pd.to_numeric(gal.get("desi_legacy_surveys_dr10__sersic",pd.Series(index=gal.index,dtype=float)),errors="coerce")
          u=pd.to_numeric(gal.get("sdss_dr18_photoobj__modelMag_u",pd.Series(index=gal.index,dtype=float)),errors="coerce"); r=pd.to_numeric(gal.get("sdss_dr18_photoobj__modelMag_r",pd.Series(index=gal.index,dtype=float)),errors="coerce")
          both=n.notna()&(n>0)&u.notna()&r.notna()&gal.get("desi_legacy_surveys_dr10__type",pd.Series(index=gal.index)).astype(str).eq("SER")
          print("LS sersic present for galaxies:", int((n>0).sum()), "/", len(gal))
          if both.any(): print(f"Sersic n>=2.5 vs SDSS u-r>=2.22 agreement: n={int(both.sum())} agree={float(((n[both]>=2.5)==((u-r)[both]>=2.22)).mean()):.3f}")
          print(top[top.subclass.notna()][["designation","primary_class","subclass","subclass_rule"]].head(25).to_string(index=False))
          if "field_prior_star" in d.columns:
              print("field prior (EM):", {k:round(float(d[f"field_prior_{k}"].iloc[0]),3) for k in ("star","galaxy","qso")}, "adjusted:", bool(d.coarse_prior_adjusted.iloc[0]))
              P=s[["p_star_training_prior","p_galaxy_training_prior","p_qso_training_prior"]].to_numpy()
              pred=pd.Series(["STAR","GALAXY","QSO"]).iloc[P.argmax(1)].to_numpy()
              ok=s.classification_status.isin(["CLASSIFIED","LOW_CONFIDENCE"]).to_numpy()
              print("training-prior argmax on the same objects:"); print(pd.crosstab(s.truth[ok],pred[ok]).to_string())
              print(f"training-prior accuracy={(pred[ok]==s.truth.to_numpy()[ok]).mean():.3f}")
          import json, numpy as np
          print("\n== GALAXY/QSO truth predicted STAR: evidence")
          for _,r in s[s.truth.ne("STAR")&s.primary_class.eq("STAR")].iterrows():
              ev=json.loads(r.evidence_json) if isinstance(r.evidence_json,str) else []
              lsr=r.get("desi_legacy_surveys_dr10__flux_r")
              print(r.truth, f"p_star={r.get('p_star',float('nan')):.2f}", "z",r.get("desi_dr1_spectroscopy__z"), "| ls_type",r.get("desi_legacy_surveys_dr10__type"),
                    "| r_mag", round(22.5-2.5*np.log10(lsr),2) if pd.notna(lsr) and lsr>0 else None, "| cats",r.catalogs)
              print("    ", [(e.get("rule_id"),e.get("class"),round(float(e.get("score") or 0),2),e.get("value")) for e in ev])
          print("\n== catalogs of NO_EVIDENCE objects"); print(d[d.classification_status.eq("NO_EVIDENCE")].catalogs.value_counts().head(12).to_string())
          print("\n== DESI-spectra objects left UNKNOWN")
          u=s[s.primary_class.eq("UNKNOWN")]
          for _,r in u.head(15).iterrows():
              ev=json.loads(r.evidence_json) if isinstance(r.evidence_json,str) else []
              print(r.truth, r.classification_status, r.catalogs, "| n_ev",len(ev), "| assoc_status",r.get("association_ambiguous"),
                    "| ls_type",r.get("desi_legacy_surveys_dr10__type"), "| ls_r_flux",r.get("desi_legacy_surveys_dr10__flux_r"),
                    "| host_r",r.get("host_elliptical_radius"), "| ls_assoc_conf",r.get("association_confidence__desi_legacy_surveys_dr10"),
                    "| p",round(r.get("p_star",float("nan")),2),round(r.get("p_galaxy",float("nan")),2),round(r.get("p_qso",float("nan")),2))
          a=pd.read_csv("/tmp/field/source_association.csv",low_memory=False)
          print("\n== association status by catalog"); print(pd.crosstab(a.catalog,a.association_status).to_string())
          print("\n== ambiguous DESI detections: neighbours within 2 arcsec (catalog, object, sep)")
          amb=a[(a.catalog=="DESI DR1 spectroscopy")&(a.association_status=="ambiguous_new")]
          cosd=np.cos(np.radians(float(a.dec.median())))
          for _,r in amb.head(12).iterrows():
              sep=np.hypot((a.ra-r.ra)*cosd,a.dec-r.dec)*3600
              nb=a[(sep<2.0)&(a.object_id!=r.object_id)].assign(sep=sep)
              print(round(float(r.get("match_separation_arcsec") or float("nan")),2), round(float(r.get("combined_sigma_arcsec") or float("nan")),2),
                    "|", sorted({(c,o,round(x,2)) for c,o,x in zip(nb.catalog,nb.object_id,nb.sep)}, key=lambda t:t[2])[:6])
          print("\n== detections of DESI objects left UNKNOWN and their neighbours within 2 arcsec")
          for oid in u.get("object_id", pd.Series(dtype=object)).head(8):
              for _,r in a[a.object_id.eq(oid)].iterrows():
                  sep=np.hypot((a.ra-r.ra)*cosd,a.dec-r.dec)*3600
                  nb=a[(sep<2.0)&(a.object_id!=oid)].assign(sep=sep).sort_values("sep").head(6)
                  print(oid, r.catalog, r.catalog_object_id, r.association_status, "|",
                        [(c,o,st,round(x,2),str(i)[:20]) for c,o,st,x,i in zip(nb.catalog,nb.object_id,nb.association_status,nb.sep,nb.catalog_object_id)])
          import glob, numpy as np
          print(pd.read_csv(glob.glob("/tmp/field/raw/**/collection_summary_*.csv",recursive=True)[0])[["collector","status","rows","elapsed_seconds"]].to_string(index=False))
          if not glob.glob("/tmp/field/raw/**/desi_legacy_*.csv",recursive=True): raise SystemExit("Legacy Surveys collection failed in this run")
          ls=pd.read_csv(glob.glob("/tmp/field/raw/**/desi_legacy_*.csv",recursive=True)[0],low_memory=False)
          ds=pd.read_csv(glob.glob("/tmp/field/raw/**/desi_spectroscopy_*.csv",recursive=True)[0],low_memory=False)
          print("\nLS rows",len(ls),"DESI rows",len(ds), "LS release values", ls.get("release",pd.Series()).value_counts().head().to_dict())
          cosd=np.cos(np.radians(43.0))
          sep=[np.min(np.hypot((ls.ra-r)*cosd,ls.dec-d))*3600 for r,d in zip(ds.ra,ds.dec)]
          print("nearest-LS separation for DESI rows (arcsec):", np.percentile(sep,[10,50,90,100]).round(2), "n>2arcsec:", int((np.array(sep)>2).sum()))
          print("LS ra/dec span", ls.ra.min(), ls.ra.max(), ls.dec.min(), ls.dec.max())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-validation
          path: /tmp/field/*.csv
          retention-days: 7
