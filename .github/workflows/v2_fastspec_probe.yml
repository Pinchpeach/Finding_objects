name: v2 DESI FastSpecFit probe

# Finds where the DESI DR1 FastSpecFit emission-line VAC can be cone-searched
# (2.7.0): NOIRLab Data Lab TAP schema desi_dr1, else VizieR.
on:
  workflow_dispatch:
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - .github/workflows/v2_fastspec_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas astropy astroquery pyvo
      - name: DESI DR1 line VAC columns (Data Lab)
        continue-on-error: true
        run: |
          python - <<'PY'
          import pyvo
          s = pyvo.dal.TAPService("https://datalab.noirlab.edu/tap")
          for n in ("desi_dr1.emfit", "desi_dr1.stellar_mass_emline", "desi_dr1.agngal"):
              t = s.search(f"SELECT description FROM tap_schema.tables WHERE table_name = '{n}'").to_table()
              print("==", n, "|", t[0]["description"] if len(t) else "")
              c = s.search(f"SELECT column_name, unit, description FROM tap_schema.columns WHERE table_name = '{n}'").to_table()
              print(len(c), "columns")
              for r in c: print("  ", r["column_name"], "|", r["unit"], "|", str(r["description"])[:110])
          PY
      - name: Cone query forms and timing
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, pyvo
          s = pyvo.dal.TAPService("https://datalab.noirlab.edu/tap")
          for n in ("desi_dr1.emfit", "desi_dr1.stellar_mass_emline", "desi_dr1.agngal"):
              for where in ("'t' = q3c_radial_query(ra, dec, 150.1, 2.2, 0.05)",
                            "1 = CONTAINS(POINT('ICRS', ra, dec), CIRCLE('ICRS', 150.1, 2.2, 0.05))",
                            "'t' = q3c_radial_query(target_ra, target_dec, 150.1, 2.2, 0.05)"):
                  t0 = time.time()
                  try:
                      r = s.search(f"SELECT TOP 5 * FROM {n} WHERE {where}").to_table()
                      print(n, "|", where[:40], "| rows", len(r), "%.1fs" % (time.time() - t0))
                      if len(r): print(r[:2]); break
                  except Exception as e:
                      print(n, "|", where[:40], "| failed", str(e)[:200])
          PY
