name: v2 independent-truth field validation

# 2026-10-21: validate v2 on many sky regions against spectroscopic classes
# from surveys never used to train or tune it (LAMOST, 2QZ/6QZ, 2dFGRS,
# 6dFGS, 2SLAQ, WiggleZ, RAVE; SDSS and DESI excluded).  Per region: fetch
# every candidate truth catalogue within 40', put the 12' field on the truth
# object with the most truth neighbours, run v2/pipeline.py there and commit
# compact products to v2/benchmark/independent_fields/<region>/ for scoring
# A second, "blind" run re-classifies the same collected data without the
# spectroscopic and literature catalogues (LAMOST, SDSS/DESI spectra, SIMBAD,
# NED, ...): these can carry the truth surveys' own labels (SIMBAD and NED
# ingest 2QZ, 2dFGRS, 6dFGS; v2 collects LAMOST DR5 itself), so only the
# blind run is an independent test.
# by v2/benchmark/score_independent_fields.py.
on:
  workflow_dispatch:
    inputs:
      mode: {description: "'probe' lists VizieR catalogues only; 'fields' runs the regions", default: "fields"}
      only: {description: "comma-separated region names to run (empty = all)", default: ""}
      radius: {description: "field radius (arcmin)", default: "12"}

permissions:
  contents: write


jobs:
  probe:
    if: ${{ github.event.inputs.mode == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests astropy astroquery pyvo
      - run: python -u .github/scripts/independent_truth_field.py probe

  field:
    if: ${{ github.event.inputs.mode == 'fields' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4  # spread the archive load (each job also waits 3-5 s per request)
      matrix:
        region:
          # name, nominal centre (deg), why this region
          - {name: ngp_165m01, ra: 165.0, dec: -1.0}    # 2QZ/2dFGRS NGP strip, b~+51
          - {name: ngp_185m01, ra: 185.0, dec: -1.0}    # 2QZ/2dFGRS NGP strip (Virgo direction), b~+61
          - {name: ngp_205m02, ra: 205.0, dec: -2.0}    # 2QZ/2dFGRS NGP strip, b~+59
          - {name: ngp_220m01, ra: 220.0, dec: -1.0}    # 2QZ/2dFGRS NGP strip east end, WiggleZ 15h, b~+50
          - {name: sgp_005m29, ra: 5.0, dec: -29.0}     # 2QZ/2dFGRS SGP strip, b~-83
          - {name: sgp_020m30, ra: 20.0, dec: -30.0}    # 2QZ/2dFGRS SGP strip, b~-84
          - {name: sgp_340m30, ra: 340.0, dec: -30.0}   # 2QZ/2dFGRS SGP strip, b~-60 (DR10 without r)
          - {name: sgp_040m28, ra: 40.0, dec: -28.5}    # 2dFGRS SGP strip east end, b~-65
          - {name: s82_030p00, ra: 30.0, dec: -0.3}     # Stripe 82: 2SLAQ, WiggleZ 1h, LAMOST
          - {name: s82_010p00, ra: 10.0, dec: -0.5}     # Stripe 82 / 2SLAQ, WiggleZ 0h, b~-63
          - {name: wigz_330p00, ra: 330.0, dec: 0.5}    # WiggleZ 22h, b~-42
          - {name: wigz_140p05, ra: 140.0, dec: 5.0}    # WiggleZ 9h, b~+35
          - {name: des_060m45, ra: 60.0, dec: -45.0}    # 6dFGS/RAVE deep south (DES footprint), b~-48
          - {name: lam_115p25, ra: 115.0, dec: 25.0}    # LAMOST Galactic anticentre, b~+20 (dense stars)
          - {name: lam_090p28, ra: 90.0, dec: 28.0}     # LAMOST anticentre in the plane, b~+3 (crowded, extincted)
          - {name: lam_015p38, ra: 15.0, dec: 38.0}     # LAMOST M31-M33 survey area, b~-25
          - {name: lam_180p50, ra: 180.0, dec: 50.0}    # LAMOST north, b~+66
          - {name: kep_291p44, ra: 291.0, dec: 44.5}    # LAMOST-Kepler field, b~+13 (crowded)
          # 2.36.2 extension to 32 regions (all > 5 deg from each other)
          - {name: ngp_150m01, ra: 150.0, dec: -1.0}    # 2dFGRS NGP strip west end / COSMOS side, b~+42
          - {name: ngp_175m03, ra: 175.0, dec: -3.0}    # 2QZ/2dFGRS NGP strip, b~+55
          - {name: ngp_195p01, ra: 195.0, dec: 1.0}     # 2QZ/2dFGRS NGP strip, b~+64
          - {name: sgp_350m30, ra: 350.0, dec: -30.0}   # 2QZ/2dFGRS SGP strip, b~-73
          - {name: sgp_030m33, ra: 30.0, dec: -33.0}    # 2dFGRS SGP strip, b~-77
          - {name: sgp_050m27, ra: 50.0, dec: -27.0}    # 2dFGRS SGP strip east end, b~-56
          - {name: lam_060p20, ra: 60.0, dec: 20.0}     # LAMOST, Taurus side of the anticentre, b~-24
          - {name: lam_130p30, ra: 130.0, dec: 30.0}    # LAMOST, b~+36
          - {name: lam_160p40, ra: 160.0, dec: 40.0}    # LAMOST north, b~+60
          - {name: lam_200p25, ra: 200.0, dec: 25.0}    # LAMOST near the NGP, b~+83
          - {name: lam_240p30, ra: 240.0, dec: 30.0}    # LAMOST, b~+49
          - {name: lam_330p25, ra: 330.0, dec: 25.0}    # LAMOST south-galactic side, b~-24
          - {name: lam_100p45, ra: 100.0, dec: 45.0}    # LAMOST outer disc, b~+17
          - {name: lam_250p10, ra: 250.0, dec: 10.0}    # LAMOST towards the inner Galaxy, b~+34
          # 2026-10-24 extension to 100 regions (>= 3.5 deg from every other region; v2/benchmark pick from survey footprints)
          - {name: ngp_180m04, ra: 180.5, dec: -4.0}    # ngp pool, b~+57
          - {name: ngp_212m04, ra: 212.0, dec: -4.0}    # ngp pool, b~+54
          - {name: ngp_160m02, ra: 159.5, dec: -1.5}    # ngp pool, b~+47
          - {name: ngp_188p02, ra: 187.5, dec: 1.5}    # ngp pool, b~+64
          - {name: ngp_208p02, ra: 208.5, dec: 1.5}    # ngp pool, b~+60
          - {name: ngp_163m04, ra: 163.0, dec: -4.0}    # ngp pool, b~+48
          - {name: ngp_156m04, ra: 156.0, dec: -4.0}    # ngp pool, b~+43
          - {name: ngp_202m04, ra: 201.5, dec: -4.0}    # ngp pool, b~+58
          - {name: ngp_170m02, ra: 170.0, dec: -1.5}    # ngp pool, b~+54
          - {name: ngp_194m04, ra: 194.5, dec: -4.0}    # ngp pool, b~+59
          - {name: ngp_177p02, ra: 177.0, dec: 1.5}    # ngp pool, b~+60
          - {name: ngp_191m02, ra: 191.0, dec: -1.5}    # ngp pool, b~+61
          - {name: ngp_202p02, ra: 201.5, dec: 1.5}    # ngp pool, b~+63
          - {name: ngp_216m02, ra: 215.5, dec: -1.5}    # ngp pool, b~+54
          - {name: sgp_017m25, ra: 17.0, dec: -25.0}    # sgp pool, b~-86
          - {name: sgp_053m35, ra: 53.0, dec: -35.0}    # sgp pool, b~-55
          - {name: sgp_017m35, ra: 17.0, dec: -35.0}    # sgp pool, b~-81
          - {name: sgp_337m25, ra: 337.0, dec: -25.0}    # sgp pool, b~-58
          - {name: sgp_001m25, ra: 1.0, dec: -25.0}    # sgp pool, b~-79
          - {name: sgp_053m30, ra: 53.0, dec: -30.0}    # sgp pool, b~-55
          - {name: sgp_329m25, ra: 329.0, dec: -25.0}    # sgp pool, b~-51
          - {name: sgp_001m30, ra: 1.0, dec: -30.0}    # sgp pool, b~-79
          - {name: sgp_013m30, ra: 13.0, dec: -30.0}    # sgp pool, b~-87
          - {name: sgp_325m35, ra: 325.0, dec: -35.0}    # sgp pool, b~-49
          - {name: sgp_009m25, ra: 9.0, dec: -25.0}    # sgp pool, b~-86
          - {name: sgp_325m25, ra: 325.0, dec: -25.0}    # sgp pool, b~-47
          - {name: sgp_349m25, ra: 349.0, dec: -25.0}    # sgp pool, b~-68
          - {name: sgp_025m35, ra: 25.0, dec: -35.0}    # sgp pool, b~-77
          - {name: sgp_005m25, ra: 5.0, dec: -25.0}    # sgp pool, b~-83
          - {name: sgp_045m25, ra: 45.0, dec: -25.0}    # sgp pool, b~-61
          - {name: s82_354p00, ra: 354.0, dec: 0.0}    # s82 pool, b~-57
          - {name: s82_326p00, ra: 326.0, dec: 0.0}    # s82 pool, b~-37
          - {name: s82_046p00, ra: 46.0, dec: 0.0}    # s82 pool, b~-48
          - {name: s82_318p00, ra: 318.0, dec: 0.0}    # s82 pool, b~-31
          - {name: s82_038p00, ra: 38.0, dec: 0.0}    # s82 pool, b~-54
          - {name: s82_350p00, ra: 350.0, dec: 0.0}    # s82 pool, b~-55
          - {name: s82_022p00, ra: 22.0, dec: 0.0}    # s82 pool, b~-61
          - {name: s82_026p00, ra: 26.0, dec: 0.0}    # s82 pool, b~-60
          - {name: lam_000p40, ra: 0.0, dec: 40.0}    # lam pool, b~-22
          - {name: lam_342p20, ra: 342.0, dec: 20.0}    # lam pool, b~-34
          - {name: lam_135p10, ra: 135.0, dec: 10.0}    # lam pool, b~+33
          - {name: lam_084p58, ra: 84.0, dec: 58.0}    # lam pool, b~+14
          - {name: lam_261p30, ra: 261.0, dec: 30.0}    # lam pool, b~+31
          - {name: lam_153p10, ra: 153.0, dec: 10.0}    # lam pool, b~+49
          - {name: lam_108p58, ra: 108.0, dec: 58.0}    # lam pool, b~+25
          - {name: lam_156p50, ra: 156.0, dec: 50.0}    # lam pool, b~+54
          - {name: lam_171p20, ra: 171.0, dec: 20.0}    # lam pool, b~+69
          - {name: lam_162p10, ra: 162.0, dec: 10.0}    # lam pool, b~+56
          - {name: lam_216p10, ra: 216.0, dec: 10.0}    # lam pool, b~+62
          - {name: lam_189p10, ra: 189.0, dec: 10.0}    # lam pool, b~+72
          - {name: lam_000p00, ra: 0.0, dec: 0.0}    # lam pool, b~-60
          - {name: lam_045p30, ra: 45.0, dec: 30.0}    # lam pool, b~-25
          - {name: lam_063p40, ra: 63.0, dec: 40.0}    # lam pool, b~-8
          - {name: lam_252p40, ra: 252.0, dec: 40.0}    # lam pool, b~+40
          - {name: lam_126p00, ra: 126.0, dec: 0.0}    # lam pool, b~+20
          - {name: lam_264p50, ra: 264.0, dec: 50.0}    # lam pool, b~+32
          - {name: lam_048p50, ra: 48.0, dec: 50.0}    # lam pool, b~-7
          - {name: lam_180p20, ra: 180.0, dec: 20.0}    # lam pool, b~+76
          - {name: lam_261p20, ra: 261.0, dec: 20.0}    # lam pool, b~+28
          - {name: lam_009p10, ra: 9.0, dec: 10.0}    # lam pool, b~-53
          - {name: lam_279p30, ra: 279.0, dec: 30.0}    # lam pool, b~+16
          - {name: lam_351p30, ra: 351.0, dec: 30.0}    # lam pool, b~-29
          - {name: lam_072p20, ra: 72.0, dec: 20.0}    # lam pool, b~-16
          - {name: lam_018p30, ra: 18.0, dec: 30.0}    # lam pool, b~-33
          - {name: lam_198p30, ra: 198.0, dec: 30.0}    # lam pool, b~+85
          - {name: lam_000p50, ra: 0.0, dec: 50.0}    # lam pool, b~-12
          - {name: lam_054p30, ra: 54.0, dec: 30.0}    # lam pool, b~-21
          - {name: lam_090p40, ra: 90.0, dec: 40.0}    # lam pool, b~+8
    env:
      NAME: ${{ matrix.region.name }}
      RA0: ${{ matrix.region.ra }}
      DEC0: ${{ matrix.region.dec }}
      R: ${{ github.event.inputs.radius || '12' }}
    steps:
      - id: pick
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ] || echo ",$only," | grep -q ",$NAME,"; then echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.run
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run
        with: {python-version: "3.11"}
      - if: steps.pick.outputs.run
        run: pip install pandas numpy scipy requests astropy astroquery pyvo
      - name: Independent truth within 40'
        if: steps.pick.outputs.run
        run: python -u .github/scripts/independent_truth_field.py truth $RA0 $DEC0 40 /tmp/truth
      - name: Field centre with the most truth objects
        if: steps.pick.outputs.run
        run: |
          read RA DEC N < <(python -u .github/scripts/independent_truth_field.py centre /tmp/truth $RA0 $DEC0 40 $R | tail -1)
          echo "centre $RA $DEC holds $N truth positions"
          echo "RA=$RA" >> "$GITHUB_ENV"; echo "DEC=$DEC" >> "$GITHUB_ENV"
      - name: Pipeline
        if: steps.pick.outputs.run
        run: python -u v2/pipeline.py --ra $RA --dec $DEC --radius $R --work /tmp/field
      - name: Blind run (no spectroscopic or literature catalogues)
        if: steps.pick.outputs.run
        run: |
          raw=$(ls -d /tmp/field/raw/*/ | head -1)
          mkdir -p /tmp/blindraw
          for f in "$raw"*.csv; do
            case "$(basename "$f")" in
              lamost_spectroscopy_*|sdss_spectroscopy_*|desi_spectroscopy_*|desi_fastspec_*|simbad_*|ned_*|bzcat_*|pn_spectroscopy_*|hash_pn_*|asas_sn_supernova_*|asiago_supernova_*|agb_suh2021_*|atnf_pulsar_*|galaxy_clusters_*) echo "blind: drop $(basename "$f")";;
              *) cp "$f" /tmp/blindraw/;;
            esac
          done
          python -u v2/pipeline.py --raw-dir /tmp/blindraw --ra $RA --dec $DEC --radius $R --work /tmp/blind
      - name: Commit compact products
        if: steps.pick.outputs.run
        run: |
          out=v2/benchmark/independent_fields/$NAME
          rm -rf "$out"; mkdir -p "$out/truth"
          cp /tmp/truth/* "$out/truth/"
          python -u .github/scripts/independent_truth_field.py compact /tmp/field $RA $DEC $R "$out"
          python -u .github/scripts/independent_truth_field.py compact /tmp/blind $RA $DEC $R "$out" objects_blind
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "Independent-truth field $NAME ($RA, $DEC, r=$R')" || exit 0
          bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.pick.outputs.run }}
        with:
          name: field-${{ matrix.region.name }}
          path: /tmp/field/*.csv
          retention-days: 7
          if-no-files-found: ignore
