name: NGC4522 field census and classification
on:
  push:
    paths: ['.github/NGC4522_FIELD_REQUEST']
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Run field classification with checkpoint budget
        run: timeout --signal=TERM 95m python scripts/ngc4522_field10.py || code=$?; if [ "${code:-0}" -eq 124 ]; then echo "Time budget reached; checkpoint artifact will be preserved."; exit 0; elif [ "${code:-0}" -ne 0 ]; then exit "${code}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ngc4522-field10-final, path: results/ngc4522_field10, retention-days: 90, if-no-files-found: warn}
