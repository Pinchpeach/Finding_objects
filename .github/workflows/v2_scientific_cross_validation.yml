name: v2 scientific cross validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/Preprocess/association_model.py'
      - 'v2/Preprocess/01_source_association.py'
      - 'v2/Preprocess/02_integrate_objects.py'
      - 'v2/Preprocess/05_likelihood_vectors.py'
      - 'v2/Get_data/**'
      - 'v2/Classifier/axes/**'
      - 'v2/Classifier/calibration/**'
      - 'v2/Classifier/truth/**'
      - 'v2/Classifier/validate_real_samples.py'
      - 'v2/Classifier/validate_independent_truth_sets.py'
      - 'v2/Classifier/tests/**'
      - '.github/workflows/v2_scientific_cross_validation.yml'

permissions:
  contents: write

concurrency:
  group: v2-scientific-cross-validation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy astropy astroquery requests scikit-learn
      - name: Unit tests
        run: python -m unittest discover -s v2/Classifier/tests -v

  validate-shard:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {key: physical-rgb, axis: physical, class: RGB}
          - {key: physical-agb, axis: physical, class: AGB}
          - {key: variability-rr, axis: variability, class: RR_LYRAE}
          - {key: variability-cepheid, axis: variability, class: CEPHEID}
          - {key: variability-mira, axis: variability, class: MIRA}
          - {key: variability-lpv, axis: variability, class: LPV}
          - {key: compact-pulsar, axis: compact, class: PULSAR}
          - {key: phenomenon-pn, axis: phenomenon, class: PN}
          - {key: phenomenon-sn, axis: phenomenon, class: SN}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy astropy astroquery requests scikit-learn
      - name: Build truth sets
        run: python -u v2/Classifier/truth/build_independent_truth_sets.py --out-dir v2/Classifier/truth/generated --limit 250
      - name: Validate shard
        run: python -u v2/Classifier/validate_independent_truth_sets.py --truth-dir v2/Classifier/truth/generated --out-dir v2/Classifier/validation/shards/${{ matrix.key }} --per-class 80 --axis ${{ matrix.axis }} --truth-class ${{ matrix.class }} --max-workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-shard-${{ matrix.key }}
          path: v2/Classifier/validation/shards/${{ matrix.key }}/
          retention-days: 7

  aggregate:
    needs: validate-shard
    if: always() && needs.validate-shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy astropy astroquery requests scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: truth-shard-*
          path: v2/Classifier/validation/shards
      - name: Merge shard predictions
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util, pandas as pd
          root=Path("v2/Classifier/validation")
          files=list((root/"shards").glob("**/independent_truth_predictions.csv"))
          if not files:
              raise SystemExit("no shard predictions")
          rows=pd.concat([pd.read_csv(p) for p in files],ignore_index=True)
          spec=importlib.util.spec_from_file_location("val","v2/Classifier/validate_independent_truth_sets.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.write_report(rows,root/"independent_truth")
          print(rows.groupby(["axis","truth_class"])[["classified","match"]].mean())
          PY
      - name: Fit supported per-axis probability calibrators
        run: python -u v2/Classifier/calibration/fit_axis_calibration.py --input v2/Classifier/validation/independent_truth/independent_truth_predictions.csv --out v2/Classifier/calibration/models.json
      - name: Run named-source blind validation
        run: python -u v2/Classifier/validate_real_samples.py --out-dir v2/Classifier/validation --max-workers 4
      - name: Commit validation products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/Classifier/validation/independent_truth v2/Classifier/validation/REAL_SAMPLE_VALIDATION.md v2/Classifier/validation/real_sample_validation.csv v2/Classifier/calibration/models.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sharded scientific validation products"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
