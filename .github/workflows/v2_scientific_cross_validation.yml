name: v2 scientific cross validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/Preprocess/association_model.py'
      - 'v2/Preprocess/01_source_association.py'
      - 'v2/Preprocess/02_integrate_objects.py'
      - 'v2/Preprocess/05_likelihood_vectors.py'
      - 'v2/Get_data/gaia_dr3.py'
      - 'v2/Get_data/agb_suh2021.py'
      - 'v2/Get_data/asas_sn_supernova.py'
      - 'v2/Get_data/asiago_supernova.py'
      - 'v2/Get_data/hash_pn.py'
      - 'v2/Get_data/pn_spectroscopy.py'
      - 'v2/Get_data/_catalog_utils.py'
      - 'v2/Classifier/axes/**'
      - 'v2/Classifier/calibration/per_axis.py'
      - 'v2/Classifier/calibration/fit_axis_calibration.py'
      - 'v2/Classifier/truth/build_independent_truth_sets.py'
      - 'v2/Classifier/validate_real_samples.py'
      - 'v2/Classifier/validate_independent_truth_sets.py'
      - 'v2/Classifier/tests/**'
      - '.github/workflows/v2_scientific_cross_validation.yml'

permissions:
  contents: write

concurrency:
  group: v2-scientific-cross-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy astropy astroquery requests scikit-learn
      - name: Unit tests for association and calibration safeguards
        run: python -m unittest discover -s v2/Classifier/tests -v
      - name: Build larger independent per-axis truth sets
        run: python -u v2/Classifier/truth/build_independent_truth_sets.py --out-dir v2/Classifier/truth/generated --limit 250
      - name: Run sampled independent truth-set cross-validation
        run: python -u v2/Classifier/validate_independent_truth_sets.py --truth-dir v2/Classifier/truth/generated --out-dir v2/Classifier/validation/independent_truth --per-class 8 --max-workers 6
      - name: Fit supported per-axis probability calibrators
        run: python -u v2/Classifier/calibration/fit_axis_calibration.py --input v2/Classifier/validation/independent_truth/independent_truth_predictions.csv --out v2/Classifier/calibration/models.json
      - name: Run named-source blind validation
        run: python -u v2/Classifier/validate_real_samples.py --out-dir v2/Classifier/validation --max-workers 4
      - name: Commit validation products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/Classifier/validation v2/Classifier/truth/generated v2/Classifier/calibration/models.json
          if ! git diff --cached --quiet; then
            git commit -m "Update independent scientific validation products"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-scientific-cross-validation
          path: |
            v2/Classifier/validation/
            v2/Classifier/truth/generated/
            v2/Classifier/calibration/models.json
