name: AGB gate contamination sample

# Gaia DR3 LPV stars in random cones with Gaia/2MASS/AllWISE photometry and
# SIMBAD types, to measure how often non-AGB stars get an AGB chemistry label
# (Classifier/subclass.py).  Also prints the columns of spectroscopic
# catalogue products (LAMOST, Gaia GSP-Spec / ESP-ELS) for the spectroscopic
# criteria.
on:
  workflow_dispatch:
    inputs:
      cones:
        description: number of random 1-degree cones
        default: "80"
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - v2/benchmark/build_agb_contamination.py
      - .github/workflows/build-agb-contamination.yml

concurrency:
  group: agb-contamination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery pyvo
      - name: Probe spectroscopic catalogue columns
        continue-on-error: true
        timeout-minutes: 15
        run: python -u v2/benchmark/probe/probe_spectro_columns.py
      - name: Build
        run: python -u v2/benchmark/build_agb_contamination.py --cones "${{ inputs.cones || '80' }}"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/agb_truth
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "AGB gate contamination sample (Gaia DR3 LPV cones + SIMBAD)"
          for i in 1 2 3; do git pull --no-rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
