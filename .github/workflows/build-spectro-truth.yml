name: Spectroscopic truth products

# SDSS emission-line / D4000 measurements (MPA-JHU, Portsmouth) for the SDSS
# benchmark galaxies and Gaia DR3 GSP-Spec / ESP-ELS and LAMOST LASP
# parameters for the benchmark stars, to validate the spectroscopic sub-class
# criteria.  Output: v2/benchmark/spectro_truth/*.csv.gz
on:
  workflow_dispatch:
    inputs:
      parts:
        description: comma-separated parts (galaxies,gaia,lamost)
        default: galaxies,gaia,lamost
  push:
    branches: [claude/code-review-7ox8zn]
    paths:
      - v2/benchmark/build_spectro_truth.py
      - .github/workflows/build-spectro-truth.yml

concurrency:
  group: spectro-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery pyvo
      - name: Build
        run: python -u v2/benchmark/build_spectro_truth.py --parts "${{ inputs.parts || 'galaxies,gaia,lamost' }}"
      - name: Summary
        run: |
          python - <<'PY'
          import glob, pandas as pd
          for f in sorted(glob.glob("v2/benchmark/spectro_truth/*.csv.gz")):
              d = pd.read_csv(f, low_memory=False)
              print("==", f, d.shape)
              print(d.notna().mean().round(3).to_string())
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/spectro_truth || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Spectroscopic truth products (SDSS lines, Gaia AP, LAMOST)"
          for i in 1 2 3; do git pull --no-rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
