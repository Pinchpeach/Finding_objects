name: v2 SGA-2020 collector probe

on:
  workflow_dispatch:
  push:
    paths:
      - v2/Get_data/sga2020.py
      - .github/workflows/v2_sga_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas astropy astroquery
      - name: Raw VizieR columns
        run: |
          python - <<'PY'
          from astroquery.vizier import Vizier
          from astropy.coordinates import SkyCoord
          import astropy.units as u
          t=Vizier(columns=["**"],row_limit=5).query_region(SkyCoord(188.4155*u.deg,9.1751*u.deg),radius=3*u.arcmin,catalog="J/ApJS/269/3")
          print(t)
          for tab in t: print(tab.colnames); print(tab[:3])
          PY
      - name: Collector on NGC 4522 field
        working-directory: v2/Get_data
        run: |
          python - <<'PY'
          import sga2020
          d=sga2020.fetch(188.4155,9.1751,0.5)
          print(d.to_string())
          assert len(d), "expected NGC 4522 in SGA-2020"
          PY
