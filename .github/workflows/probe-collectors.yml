name: Probe collectors (AllWISE / 2MASS / GALEX)

# Diagnostic: these VizieR collectors returned nothing in every reference-
# object run (2.46.2).  Runs them directly and through the controller.
on:
  push:
    branches-ignore: [main, validation-data]
    paths: [".github/workflows/probe-collectors.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy requests astropy astroquery pyvo
      - name: Variants
        run: |
          pip list 2>/dev/null | grep -iE "astroquery|astropy |pyvo"
          python - <<'PY'
          import astropy.units as u
          from astropy.coordinates import SkyCoord
          from astroquery.vizier import Vizier
          c = SkyCoord(296.69275*u.deg, -25.37747*u.deg)
          for cat in ("II/328/allwise", "II/246/out", "VIII/65/nvss"):
              for kw in (dict(columns=["**"], row_limit=-1), dict(columns=["**"], row_limit=50000), dict(row_limit=-1), dict(columns=["*"], row_limit=1000)):
                  try:
                      t = Vizier(**kw).query_region(c, radius=1*u.arcmin, catalog=cat)
                      print(cat, kw, "tables", len(t), "rows", len(t[0]) if len(t) else 0, flush=True)
                  except Exception as e:
                      print(cat, kw, "ERR", repr(e)[:200], flush=True)
          v = Vizier(columns=["**"], row_limit=-1)
          q = v.query_region(c, radius=1*u.arcmin, catalog="II/328/allwise", get_query_payload=True)
          print("payload", q)
          PY
