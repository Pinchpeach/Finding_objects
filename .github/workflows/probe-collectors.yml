name: Probe collectors (AllWISE / 2MASS / GALEX)

# Diagnostic: these VizieR collectors returned nothing in every reference-
# object run (2.46.2).  Runs them directly and through the controller.
on:
  push:
    branches-ignore: [main, validation-data]
    paths: [".github/workflows/probe-collectors.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy requests astropy astroquery pyvo
      - name: Controller after the mirror fix
        timeout-minutes: 20
        run: |
          python -u v2/Get_data/controller.py --ra 296.69275 --dec -25.37747 --radius 0.3 --out-dir /tmp/raw --workers 6 2>&1 | grep -E "^\[(allwise|twomass|galex|nvss|tgss|vlass|sga2020|gaia_dr3_variability_sos_vizier)\]" | head -40
