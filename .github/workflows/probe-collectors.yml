name: Probe collectors (AllWISE / 2MASS / GALEX)

# Diagnostic: these VizieR collectors returned nothing in every reference-
# object run (2.46.2).  Runs them directly and through the controller.
on:
  push:
    branches-ignore: [main, validation-data]
    paths: [".github/workflows/probe-collectors.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy requests astropy astroquery pyvo
      - name: Mirrors
        timeout-minutes: 15
        run: |
          python - <<'PY'
          import requests, time
          hosts = ("vizier.cds.unistra.fr","vizier.cfa.harvard.edu","vizier.nao.ac.jp","vizier.iucaa.in","vizier.china-vo.org","vizier.idia.ac.za")
          for cat in ("II/328/allwise", "II/246/out", "VIII/65/nvss"):
              for h in hosts:
                  url = f"https://{h}/viz-bin/votable/-A?-source={cat}&-c=296.69275%20-25.37747&-c.rm=1&-out.max=50"
                  t = time.time()
                  try:
                      r = requests.get(url, timeout=(10, 40))
                      body = r.text
                      print(f"{cat:16s} {h:26s} {r.status_code} {len(body):7d}B {time.time()-t:5.1f}s TR={body.count('<TR>')} TABLE={'<TABLE' in body} err={'QUERY_STATUS' in body and 'ERROR' in body}", flush=True)
                      if r.status_code == 200 and body.count('<TR>') == 0:
                          i = body.find('INFO'); print('    ', body[i:i+300].replace(chr(10),' '), flush=True)
                  except Exception as e:
                      print(f"{cat:16s} {h:26s} EXC {type(e).__name__} {time.time()-t:5.1f}s", flush=True)
          PY
