name: v2 NGC4522 small collection

# Manual only (2.24.0): it rewrites preserved benchmark / truth data, which
# must change only on purpose (an automatic run on a code push replaced the
# DESI benchmark with a partial re-collection on 2026-10-14).
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: v2-ngc4522-small-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pandas requests astropy astroquery
      - name: Collect and validate
        run: python -u v2/scripts/collect_ngc4522_small.py
      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/rawdata
          if ! git diff --cached --quiet; then
            git commit -m "Collect NGC4522 small-field raw data"
            bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngc4522-v2-small-rawdata
          path: v2/rawdata/
