name: Unit tests

# 2.62.4 (task 타).  The tests of the repository as CLAUDE.md names them -- `cd v2 && python -m pytest -q Preprocess/tests Classifier/tests app/tests` -- in one place.
# Before this, CI ran Preprocess/tests (test-preprocess.yml) and Classifier/tests (v2_scientific_cross_validation.yml, only when its paths change) and NEVER app/tests,
# the integration tests of the app that catch an association regression (CLAUDE.md).  `v2/Preprocess/tests/test_ci_test_set.py` keeps this command, CLAUDE.md and the
# tests folders the same set; assert_no_skips.py turns a skipped test (no Qt on the runner) and a folder that collected nothing into a failure.

# 2.62.5: no path filter on pull_request, so every PR gets this check.  A required check that a path filter skips never reports, and GitHub then
# blocks the PR ("Expected -- Waiting for status to be reported").  Cost: one 2-3 minute run per PR push.  The main push keeps its filter
# (a required check is not read there, and the data commits of the collection workflows need no test run).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'CLAUDE.md'
      - '.github/workflows/unit-tests.yml'
      - '.github/scripts/assert_no_skips.py'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # app/tests set it themselves too (os.environ.setdefault); the runner has no display
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/app/requirements.txt
      - name: System libraries Qt needs to start without a display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Python packages
        # v2/app/requirements.txt = PySide6, pandas, numpy, scipy, requests, astropy, astroquery, pyvo; the rest is what the three test folders import
        # (scikit-learn: Classifier; reportlab / python-pptx / pypdf: the overview and deck tests of Preprocess run instead of skipping)
        run: python -m pip install --upgrade pip && python -m pip install -r v2/app/requirements.txt pytest scikit-learn reportlab python-pptx pypdf
      - name: Qt starts (fail here, not as 17 skipped tests)
        run: python -c "from PySide6.QtWidgets import QApplication; QApplication([]); print('Qt offscreen ok')"
      - name: Tests (the command of CLAUDE.md)
        working-directory: v2
        run: python -m pytest -q Preprocess/tests Classifier/tests app/tests -rs --junitxml=../unit-tests.xml
      - name: No test skipped, no folder missing
        if: always()
        run: python .github/scripts/assert_no_skips.py unit-tests.xml --require Preprocess.tests Classifier.tests app.tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-junit
          path: unit-tests.xml
          retention-days: 14
