name: Build reference objects (literature-confirmed, per type)

# Objects of confirmed nature per class and sub-class, with the paper each
# identification comes from (v2/benchmark/build_reference_objects.py).
# Runs on pushes that change the builder on working branches, or by hand.
on:
  push:
    branches-ignore: [main, validation-data]
    paths: ["v2/benchmark/build_reference_objects.py", ".github/workflows/build-reference-objects.yml"]
  workflow_dispatch:
concurrency:
  group: reference-objects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy astroquery
      - name: Build
        run: python -u v2/benchmark/build_reference_objects.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/reference_objects || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Reference objects (literature-confirmed, per type)"
          bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
