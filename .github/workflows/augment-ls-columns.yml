name: Add LS DR10 morphology columns to benchmark features

# Fetches sersic, shape_r and W1/W2 inverse variances by ls_id (2.11.0).
# Manual only (2.24.0): it rewrites preserved benchmark / truth data, which
# must change only on purpose (an automatic run on a code push replaced the
# DESI benchmark with a partial re-collection on 2026-10-14).
on:
  workflow_dispatch:
concurrency:
  group: augment-ls-columns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy astropy pyvo
      - name: Build
        run: python -u v2/benchmark/augment_ls_columns.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/catalog_features v2/benchmark/desi_external/catalog_features || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add LS DR10 morphology columns to benchmark features"
          bash .github/scripts/push_with_retry.sh
