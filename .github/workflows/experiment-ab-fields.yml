          - {name: sfr_serpens, ra: 277.45, dec: 1.25, r: 12.0}
          - {name: sfr_w51, ra: 290.9, dec: 14.1, r: 6.0}
          - {name: deep_cosmos_1, ra: 149.85, dec: 1.95, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_2, ra: 149.85, dec: 2.21, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_3, ra: 149.85, dec: 2.47, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_4, ra: 150.12, dec: 1.95, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_5, ra: 150.12, dec: 2.21, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_6, ra: 150.12, dec: 2.47, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_7, ra: 150.39, dec: 1.95, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_8, ra: 150.39, dec: 2.21, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
          - {name: deep_cosmos_9, ra: 150.39, dec: 2.47, r: 6.0, deep: true}  # COSMOS2020 / HST-ACS truth
    env:
      NAME: ${{ matrix.f.name }}
      RA: ${{ matrix.f.ra }}
      DEC: ${{ matrix.f.dec }}
      R: ${{ matrix.f.r }}
    steps:
      - id: pick
        run: |
          set="${{ github.event.inputs.fieldset || 'b' }}"; deep="${{ matrix.f.deep || false }}"
          if [ "$set" = all ] || { [ "$set" = deep ] && [ "$deep" = true ]; } || { [ "$set" = b ] && [ "$deep" != true ]; }; then echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.run
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy requests astropy astroquery pyvo
        if: steps.pick.outputs.run
      - name: Deep truth (COSMOS2020) and field record
        if: steps.pick.outputs.run && matrix.f.deep
        run: |
          python -u .github/scripts/independent_truth_field.py truth_deep $RA $DEC $R /tmp/ref/truth
          echo "{\"ra\": $RA, \"dec\": $DEC, \"radius_arcmin\": $R}" > /tmp/ref/field.json
      - name: Truth and field record from validation-data
        if: steps.pick.outputs.run && !matrix.f.deep
        run: |
          git fetch -q --depth=1 origin validation-data
          git checkout origin/validation-data -- "v2/benchmark/independent_fields_b/$NAME"
          mkdir -p /tmp/ref && cp -r "v2/benchmark/independent_fields_b/$NAME/truth" "v2/benchmark/independent_fields_b/$NAME/field.json" /tmp/ref/
          git rm -rq --cached "v2/benchmark/independent_fields_b/$NAME" && rm -rf "v2/benchmark/independent_fields_b/$NAME"
      - name: Collect (once)
        if: steps.pick.outputs.run
        run: python -u v2/pipeline.py --ra $RA --dec $DEC --radius $R --work /tmp/field
      - name: Blind raw and shifted copy
        if: steps.pick.outputs.run
        run: |
          raw=$(ls -d /tmp/field/raw/*/ | head -1)
          mkdir -p /tmp/blindraw
          for f in "$raw"*.csv; do
            case "$(basename "$f")" in
              lamost_spectroscopy_*|sdss_spectroscopy_*|desi_spectroscopy_*|desi_fastspec_*|simbad_*|ned_*|bzcat_*|pn_spectroscopy_*|hash_pn_*|asas_sn_supernova_*|asiago_supernova_*|agb_suh2021_*|atnf_pulsar_*|galaxy_clusters_*) ;;
              *) cp "$f" /tmp/blindraw/;;
            esac
          done
          ls /tmp/blindraw
          python - <<'PY'
          import pandas as pd, shutil
          from pathlib import Path
          src, dst = Path("/tmp/blindraw"), Path("/tmp/shiftraw")
          shutil.copytree(src, dst)
          for f in dst.glob("*.csv"):
              d = pd.read_csv(f, low_memory=False)
              cats = set(d.catalog.astype(str)) if "catalog" in d else set()
              # opposite directions, so a shifted WISE row cannot find its own
              # shifted 2MASS row (2.49.0; the 2.48.0 test moved both together)
              step = 2.0 / 60.0 if "AllWISE" in cats else (-2.0 / 60.0 if "2MASS PSC" in cats else None)
              if step is not None:
                  d["dec"] = pd.to_numeric(d.dec, errors="coerce") + step
                  d.to_csv(f, index=False)
                  print("shifted", f.name, len(d))
          PY
      - name: Variants
        if: steps.pick.outputs.run
        run: |
          # base = current defaults; phot/cand/both = the 2.48.0 association
          # switches against a no-prior baseline; lsw = WISE from LS forced photometry.
          for v in ${{ github.event.inputs.variants || 'base lsw' }}; do
            unset V2_ASSOC_PHOT_PRIOR V2_ASSOC_CANDIDATE_DENSITY V2_WISE_FROM_LS V2_ASSOC_MAX_NSEP
            case $v in
              phot) export V2_ASSOC_PHOT_PRIOR=1 V2_ASSOC_CANDIDATE_DENSITY=0 V2_ASSOC_MAX_NSEP=0;;
              cand) export V2_ASSOC_PHOT_PRIOR=0 V2_ASSOC_CANDIDATE_DENSITY=1 V2_ASSOC_MAX_NSEP=0;;
              both) export V2_ASSOC_PHOT_PRIOR=1 V2_ASSOC_CANDIDATE_DENSITY=1 V2_ASSOC_MAX_NSEP=0;;
              old) export V2_ASSOC_PHOT_PRIOR=0 V2_ASSOC_CANDIDATE_DENSITY=0 V2_ASSOC_MAX_NSEP=0;;
              lsw) export V2_WISE_FROM_LS=1;;
              nominp) export V2_ASSOC_MAX_NSEP=0;;
              minp) export V2_ASSOC_MAX_NSEP=1;;
              minp_lsw) export V2_ASSOC_MAX_NSEP=1 V2_WISE_FROM_LS=1;;
            esac
            python -u v2/pipeline.py --raw-dir /tmp/blindraw --ra $RA --dec $DEC --radius $R --work /tmp/run_$v
            python -u v2/Preprocess/01_source_association.py --raw-dir /tmp/shiftraw --out /tmp/shift_$v.csv
            out=/tmp/ab/$v/$NAME; mkdir -p $out
            cp -r /tmp/ref/truth /tmp/ref/field.json $out/
            python -u .github/scripts/independent_truth_field.py compact /tmp/run_$v $RA $DEC $R $out objects_blind
            python -u .github/scripts/assoc_stats.py /tmp/run_$v/source_association.csv /tmp/shift_$v.csv $out/assoc_pairs.csv.gz > $out/assoc_stats.json
            cp /tmp/run_$v/pipeline_summary.csv $out/ || true
            cat $out/assoc_stats.json
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.run
        with:
          name: ab-${{ matrix.f.name }}
          path: /tmp/ab/
          if-no-files-found: ignore
  score:
    needs: field
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy astropy
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: /tmp/ab
          merge-multiple: true
      - name: Compare
        run: |
          out=v2/benchmark/experiments/${{ github.event.inputs.experiment || 'wise_from_ls' }}
          mkdir -p $out
          (cd v2/benchmark && python -u compare_ab_fields.py /tmp/ab --out ../../$out) | tee $out/compare.log
          python - <<'PY'
          import pandas as pd, glob, os
          rows = []
          for f in glob.glob("/tmp/ab/*/*/pipeline_summary.csv"):
              v, field = f.split("/")[3:5]
              s = pd.read_csv(f).set_index("stage").seconds
              rows.append({"variant": v, "field": field, **s.to_dict()})
          pairs = []
          for f in glob.glob("/tmp/ab/*/*/assoc_pairs.csv.gz"):
              v, field = f.split("/")[3:5]
              pairs.append(pd.read_csv(f, low_memory=False).assign(variant=v, field=field))
          if pairs:
              pd.concat(pairs).to_csv("v2/benchmark/experiments/" + os.environ["EXP"] + "/assoc_pairs.csv.gz", index=False)
          if rows:
              t = pd.DataFrame(rows)
              out = "v2/benchmark/experiments/" + os.environ["EXP"]
              t.to_csv(out + "/stage_seconds.csv", index=False)
              print(t.drop(columns="field").groupby("variant").median(numeric_only=True).to_string())
          PY
        env:
          EXP: ${{ github.event.inputs.experiment || 'wise_from_ls' }}
      - name: Commit
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/benchmark/experiments
          git commit -m "A/B experiment results: ${{ github.event.inputs.experiment || 'wise_from_ls' }}" || exit 0
          bash .github/scripts/push_with_retry.sh "${{ github.ref_name }}"
