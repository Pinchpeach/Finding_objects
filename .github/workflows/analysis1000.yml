name: 1000-object analysis stages
on:
  push:
    paths: ['.github/ANALYSIS_1000_REQUEST']
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -e .
      - name: Restore base 1000 sample
        run: |
          mkdir -p data/batch1000
          gh run download 35344425464 -n batch-1000-retrieval -D data/batch1000
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Restore completed multiwavelength data
        run: |
          mkdir -p data/batch1000_multi
          gh run download 35382352114 -n batch-1000-multiwavelength -D data/batch1000_multi
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: python scripts/stage_association.py
      - name: Stage association output for photometry
        run: |
          mkdir -p data/stage02
          cp results/stages/02_association/associations.csv data/stage02/associations.csv
      - run: python scripts/stage_photometry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-03-photometry
          path: results/stages/03_photometry/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-02-association
          path: results/stages/02_association/*
          retention-days: 30
